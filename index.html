      <p style="font-size:13px;color:#8b97b0">↑↓ 选择 · Enter 确认 · Esc 继续</p>
      <div class="hex-cards" style="margin-top:16px">${list}</div>
      <p style="font-size:12px;color:#7f8eaa;margin-top:8px">
        角色 <strong style="color:#eef3ff">${G.klass==="melee"?"近战":G.klass==="bulwark"?"坦克":"远程"}</strong>
        · 第 ${G.room} 层 · Lv.${G.level} · 局时 ${G.runTime.toFixed(1)}s
        · HP ${Math.ceil(player.hp)}/${player.maxHp}
      </p>
      <p style="font-size:12px;color:#d7a6ff">海克斯：${hexList}</p>
      <p style="font-size:12px;color:#5dffb0">现在结算可得 ◆${take} · 攀升 ${G.ascension||0}</p>
    `;
    overlay.classList.add("show");
    // 事件委托：禁止 hover 整页重绘（会拆掉 DOM 导致点击无响应）
    const wrap = overlayCard.querySelector(".hex-cards");
    if (wrap){
      wrap.onclick = (ev)=>{
        const el = ev.target.closest(".hex-card");
        if (!el || !wrap.contains(el)) return;
        ev.preventDefault(); ev.stopPropagation();
        if (G.state !== "pause") return;
        const now = performance.now();
        if (wrap._lock && now - wrap._lock < 280) return;
        wrap._lock = now;
        G.pauseIndex = parseInt(el.dataset.i, 10);
        confirmPause();
      };
      wrap.onmousemove = (ev)=>{
        const el = ev.target.closest(".hex-card");
        if (!el) return;
        const i = parseInt(el.dataset.i, 10);
        if (i === G.pauseIndex) return;
        G.pauseIndex = i;
        wrap.querySelectorAll(".hex-card").forEach((c, idx)=> c.classList.toggle("sel", idx === i));
      };
    }
  }

  function confirmPause(){
    if (G.state !== "pause") return;
    if (G.pauseIndex===0){ closePause(); return; }
    if (G.pauseIndex===2){
      logAttempt("restart");
      G.attempt += 1;
      startRun(G.mode || "endless");
      return;
    }
    // 放弃 → 二次确认
    G.state = "pauseConfirm";
    G.pauseIndex = 0;
    renderAbandonConfirm();
  }

  function renderAbandonConfirm(){
    const yes = G.pauseIndex===0;
    overlayCard.innerHTML = `
      <h1 class="danger" style="font-size:22px">放弃本局？</h1>
      <p style="font-size:14px;color:#c9d6ee">已得进度按 <strong>55%</strong> 结算，返回标题。<br/>海克斯与构筑全部清空。</p>
      <div class="variant" style="margin-top:18px">
        <button type="button" id="ab-yes" style="pointer-events:auto;cursor:pointer;border:1px solid ${yes?"#ff5d6c":"#35507a"};background:${yes?"#2a1218":"#121a2c"};color:#eef3ff;padding:10px 18px;font-family:inherit;font-size:13px">确认放弃</button>
        <button type="button" id="ab-no" style="pointer-events:auto;cursor:pointer;border:1px solid ${!yes?"#5dffb0":"#35507a"};background:${!yes?"#0f2419":"#121a2c"};color:#eef3ff;padding:10px 18px;font-family:inherit;font-size:13px">再想想</button>
      </div>
      <div class="hint"><span>←→ 切换 · Enter 确认 · Esc 返回</span></div>
    `;
    overlay.classList.add("show");
    const yesBtn = document.getElementById("ab-yes");
    const noBtn = document.getElementById("ab-no");
    if (yesBtn) yesBtn.onclick = (e)=>{ e.preventDefault(); e.stopPropagation(); G.pauseIndex=0; doAbandonConfirm(); };
    if (noBtn) noBtn.onclick = (e)=>{ e.preventDefault(); e.stopPropagation(); G.pauseIndex=1; doAbandonConfirm(); };
  }

  function doAbandonConfirm(){
    if (G.state !== "pauseConfirm" && G.state !== "pause") return;
    if (G.pauseIndex===1){
      G.state="pause";
      renderPause();
      return;
    }
    try {
      logAttempt("abandon");
      const gain = settle("abandon");
      accumulateStats();
      checkAchievements();
      toast(`已放弃 · 结算 ◆${gain}（55%）`, 2.2);
    } catch(err){
      console.warn("abandon settle", err);
      toast("已放弃", 1.5);
    }
    G.attempt += 1;
    G.state = "title";
    overlay.classList.remove("show");
    setTimeout(()=>showTitle(), 80);
  }

  function openHexPick(resume){
    G.hexResume = resume || "start";
    G.state = "hexPick";
    const pickN = ((G.C && G.C.hexPickCount) || 3) + (hasMeta("hex_pick4") ? 1 : 0);
    // 候选：未拥有 + 未满级升级
    let cands = HEX_POOL.filter(h => {
      // 角色限定：近战不进弹丸池
      if (h.only && h.only !== G.klass) return false;
      const lv = G.hexLevels[h.id] || 0;
      if (lv > 0) return lv < (h.maxLevel || 2);
      for (const ex of (h.exclude || [])) if (G.hexes.includes(ex)) return false;
      return true;
    });
    if (!cands.length){ finishHexPick(); return; }

    // M-17 权重抽样 + 保底：至少 1 金以上；第 4 次至少 1 彩
    const hexPickCount = G.hexPickCountTotal = (G.hexPickCountTotal||0) + 1;
    const forced = [];
    if (hexPickCount % 4 === 0){
      const prisms = cands.filter(h => h.tier==="prism");
      if (prisms.length) forced.push(prisms[(Math.random()*prisms.length)|0]);
    }
    if (!forced.some(h => h.tier==="gold" || h.tier==="prism")){
      const golds = cands.filter(h => h.tier==="gold" || h.tier==="prism");
      if (golds.length) forced.push(golds[(Math.random()*golds.length)|0]);
    }
    const picked = forced.slice();
    const rest = cands.filter(h => !picked.includes(h));
    while (picked.length < pickN && rest.length){
      // 加权
      let total=0;
      const w = rest.map(h => { const t = TIER_WEIGHT[h.tier]||30; total+=t; return t; });
      let r = Math.random()*total;
      let idx=0;
      for (let i=0;i<rest.length;i++){ r-=w[i]; if (r<=0){ idx=i; break; } }
      picked.push(rest.splice(idx,1)[0]);
    }
    // 升级项混入
    const upgrades = picked.filter(h => (G.hexLevels[h.id]||0) > 0);
    if (!upgrades.length){
      const upCands = cands.filter(h => (G.hexLevels[h.id]||0) > 0);
      if (upCands.length && picked.length){
        picked[picked.length-1] = upCands[(Math.random()*upCands.length)|0];
      }
    }

    G.hexOffer = picked.map(h=>h.id);
    G.hexPickIndex = 0;
    renderHexPick();
  }

  function renderHexPick(){
    const mid = G.hexResume === "playing";
    const cards = G.hexOffer.map((id, i)=>{
      const h = HEX_BY_ID[id];
      const col = TIER_COLOR[h.tier];
      const sel = i===G.hexPickIndex ? " sel" : "";
      const lv = G.hexLevels[id] || 0;
      const isUp = lv > 0;
      return `
        <div class="hex-card${sel}" data-i="${i}" style="--hc:${col}">
          <div class="hx-top">
            <span class="hx-name">${h.name}${isUp?` → Lv${lv+1}`:""}</span>
            <span class="hx-tag">${isUp?"升级":h.tag}</span>
          </div>
          <div class="hx-desc">${h.desc}</div>
          <div class="hx-cost">代价：${h.cost}</div>
          ${h.upgrade?`<div class="hx-up">${isUp?"下一级：" + (h.upgrade.text2||"增强") : "升级：" + h.upgrade.text + " → " + h.upgrade.text2}</div>`:""}
        </div>`;
    }).join("");
    overlayCard.innerHTML = `
      <h1 class="idle" style="font-size:22px">${mid ? "升级 · 选择海克斯" : "选择海克斯"}</h1>
      <p style="font-size:13px;color:#8b97b0">${mid ? "战斗已暂停，选完继续本层。" : "改写本局规则，不可撤销。"}点击 / ←→ 选择 · Enter 确认 · Esc 跳过</p>
      <div class="hex-cards" id="hex-cards">${cards}</div>
      <div class="action-row">
        <button type="button" class="action-btn ghost" data-act="skipHex">${mid ? "跳过 · 继续战斗" : "跳过 · 直接进房"}</button>
      </div>
    `;
    overlay.classList.add("show");
    bindOverlayActions();

    // 事件委托：避免 hover 整页重绘导致点击目标被销毁
    const wrap = document.getElementById("hex-cards");
    if (wrap){
      wrap.onclick = (ev)=>{
        const el = ev.target.closest(".hex-card");
        if (!el || !wrap.contains(el)) return;
        ev.preventDefault();
        ev.stopPropagation();
        if (G.state !== "hexPick") return;
        // 防连点/双击导致状态闪烁
        const now = performance.now();
        if (wrap._lock && now - wrap._lock < 350) return;
        wrap._lock = now;
        G.hexPickIndex = parseInt(el.dataset.i, 10);
        applyHexPick();
      };
      wrap.onmousemove = (ev)=>{
        const el = ev.target.closest(".hex-card");
        if (!el) return;
        const i = parseInt(el.dataset.i, 10);
        if (i === G.hexPickIndex) return;
        G.hexPickIndex = i;
        wrap.querySelectorAll(".hex-card").forEach((c, idx)=>{
          c.classList.toggle("sel", idx === i);
        });
      };
    }
  }

  function applyHexPick(){
    const id = G.hexOffer[G.hexPickIndex];
    if (!id){ skipHexPick(); return; }
    const prev = G.hexLevels[id] || 0;
    if (prev === 0){
      G.hexes.push(id);
      G.hexLevels[id] = 1;
    } else {
      G.hexLevels[id] = Math.min(prev + 1, HEX_BY_ID[id].maxLevel || 2);
    }
    rebuildCfg();
    const h = HEX_BY_ID[id];
    const lv = G.hexLevels[id];
    toast((prev===0?"已装配：":"升级：") + h.name + " Lv" + lv, 2);
    SFX.pickup();
    if (player.alive && prev > 0) {
      ring(player.x, player.y, 40, TIER_COLOR[h.tier], 0.35, 2);
    }
    finishHexPick();
  }

  function skipHexPick(){
    toast("跳过海克斯", 1.0);
    finishHexPick();
  }

  function finishHexPick(){
    const resume = G.hexResume || "start";
    G.hexResume = null;

    if (resume === "playing" && G.state !== "dead" && G.state !== "dying"){
      // 中断恢复：不重开房间、不回血、不刷怪
      G.state = "playing";
      overlay.classList.remove("show");
    } else if (resume === "start"){
      beginCombat();
    } else {
      G.state = "playing";
      overlay.classList.remove("show");
    }

    // 还有未处理的升级海克斯 → 继续弹（打开时再扣 pending）
    if (G.levelUpPending > 0 && G.state === "playing"){
      setTimeout(()=>{
        if (G.state === "playing" && G.levelUpPending > 0){
          maybeOpenLevelHex();
        }
      }, 150);
    }
  }

  function beginCombat(){
    // 开局首房
    beginRoom(true);
    G.state = "playing";
    overlay.classList.remove("show");
    const kn = G.klass==="melee"?"近战「刃」":G.klass==="bulwark"?"坦克「盾」":"远程「弦」";
    toast(`${kn} · 第 1 层`, 1.6);
  }

  // [约束] beginRoom 只重置房间状态，不重置 runTime / hp / hexes
  function beginRoom(isFirst){
    G.roomTime = 0;
    G.roomClearing = false;
    G.roomKills = 0;
    G.hitstop = 0;
    G.shake = 0;
    G.slowmo = 0;
    G.slowmoUsed = false;
    G.particles = [];
    G.ghosts = [];
    G.projectiles = [];
    G.drops = [];
    G.texts = [];
    G.rings = [];
    G.killer = null;
    G.deathFlash = 0;
    G.flash = 0;
    // 遥测：整局保留，每房重置窗口（M-11 完整版再分房快照）
    G.tel = {frames:0,approachFrames:0,ratio:0,hitsTaken:0,breaksUsed:0,closeHits:0,dodgeSuccess:0};

    player.x = CFG.roomW/2;
    player.y = CFG.roomH/2+50;
    player.facing = -Math.PI/2;
    player.dodgeCd = 0;
    player.dodgeTimer = 0;
    player.invuln = 0.25;
    player.hitFlash = 0;
    player.atk = null;
    player.alive = true;
    // maxHp 只在 startRun / 升级时更新；此处不回满血（M-03）
    if (isFirst || player.hp <= 0) {
      player.maxHp = (G.C||CFG).playerMaxHp + (G.level-1)*CFG.levelHpPer;
      player.hp = player.maxHp;
    }

    enemies = [];
    buildWave(G.room);

    // 治疗预算：前 3 层保底 2，之后 2；行囊扩容 +1
    G.healBudget = 2 + (hasMeta("heal_budget") ? 1 : 0);

    // 首只立刻出场
    if (G.spawnQueue.length) {
      const spec = G.spawnQueue.shift();
      spawnEnemy(spec, CFG.roomW/2, CFG.roomH/2-140);
    }
    G.spawnTimer = 0.85;
    G.state = "playing";
    // 从出口/暂停恢复进房时必须关窗
    overlay.classList.remove("show");
    if (!isFirst) toast(`第 ${G.room} 层 · HP ${Math.ceil(player.hp)}/${player.maxHp}`, 1.4);
  }

  // M-07 简化版：数量缓增、生命全速、韧性/伤害在 spawnEnemy 内 ^0.55/^0.40
  function waveMul(room){
    // 对齐清单 §1.3 分段的粗包络
    if (room <= 3) return 1.0;
    if (room <= 7) return 1.3;
    if (room <= 11) return 1.8;
    if (room <= 15) return 2.6;
    if (room <= 20) return 3.8;
    if (room <= 25) return 5.5;
    if (room <= 30) return 8.0;
    return 8.0 * Math.pow(1.45, Math.floor((room - 30) / 5) + 1);
  }

  function unlockPool(room){
    if ((G.C||CFG).casterBias){
      return ["caster","caster","caster","grunt","dasher"];
    }
    if (room <= 3) return ["grunt"];
    if (room < 8) return ["grunt","grunt","caster"];
    if (room < 12) return ["grunt","grunt","caster","caster"];
    return ["grunt","grunt","caster","caster","dasher"];
  }

  function buildWave(room){
    const C = G.C || CFG;
    // 模式特化波次
    if (G.mode === "bossrush"){
      const types = [];
      if (room === 1) types.push("elite");
      else if (room % 3 === 0) types.push("elite","elite");
      else types.push("elite","grunt","caster");
      G.waveMul = 1.2 + room * 0.35;
      G.roomTarget = types.length;
      G.spawnQueue = types;
      return;
    }
    if (G.mode === "campaign" && room === 12){
      // Boss 房：1 超大精英 + 2 近战护卫
      G.waveMul = waveMul(room) * 1.5;
      G.roomTarget = 3;
      G.spawnQueue = ["elite","grunt","grunt"];
      return;
    }
    const count = clamp(
      Math.floor((CFG.waveBaseCount + (room-1) * CFG.waveCountPerRoom) * (C.waveCountMul||1)),
      3, CFG.waveMaxCount
    );
    G.waveMul = waveMul(room);
    G.roomTarget = count;
    const pool = unlockPool(room);
    const q = [];
    let eliteLeft = (room >= 8 && room % 5 === 0) ? 1 : 0;
    if (C.doubleElite) eliteLeft *= 2;
    for (let i=0;i<count;i++){
      if (eliteLeft > 0 && (i === 0 || i === Math.floor(count/2))){
        q.push("elite");
        eliteLeft--;
      } else {
        q.push(pool[(Math.random()*pool.length)|0]);
      }
    }
    if (room === 1) q[0] = "grunt";
    G.spawnQueue = q;
    // 每日种子：用确定性 RNG 重排生成
    if (G.mode === "daily" && G.rng){
      for (let i = q.length-1; i > 0; i--){
        const j = Math.floor(gameRandom() * (i+1));
        const t = q[i]; q[i]=q[j]; q[j]=t;
      }
      if (q.length) q[0] = "grunt";
    }
  }

  function onRoomClear(){
    if (G.tel.hitsTaken === 0) G.noHitRooms = (G.noHitRooms||0) + 1;
    G.telByRoom.push({
      room: G.room,
      time: G.roomTime,
      ratio: G.tel.ratio,
      hits: G.tel.hitsTaken,
      breaksUsed: G.tel.breaksUsed,
      breaks: G.breaks,
      kills: G.roomKills,
      level: G.level,
    });

    const cleared = G.room;
    grantExp(CFG.expRoomClear + Math.round(cleared * 2));
    G.roomKills = 0;

    // 战役：打完第 12 层通关
    if (G.mode === "campaign"){
      if (cleared >= 12){
        showModeWin("战役通关");
        return;
      }
      G.room = cleared + 1;
      beginRoom(false);
      return;
    }

    // Boss 连战：10 个遭遇后结算
    if (G.mode === "bossrush"){
      if (cleared >= 10){
        showModeWin("Boss 连战完成");
        return;
      }
      G.room = cleared + 1;
      beginRoom(false);
      return;
    }

    // 竞技场：不死就一直刷，无出口；90s 后加分结算可选
    if (G.mode === "arena"){
      G.modeScore += cleared * 10 + G.roomKills * 5;
      G.room = cleared + 1;
      if (G.runTime >= 90){
        showModeWin("竞技场 90 秒达成");
        return;
      }
      beginRoom(false);
      return;
    }

    // 挑战：打到 10 层即算完成
    if (G.mode === "challenge"){
      if (cleared >= 10){
        showModeWin("挑战完成 · " + (G.modeChallenge||""));
        return;
      }
      G.room = cleared + 1;
      beginRoom(false);
      return;
    }

    // 无尽 / 自定义：出口节点
    G.room = cleared + 1;
    if (cleared % CFG.exitEvery === 0){
      openExit(cleared);
      return;
    }
    beginRoom(false);
  }

  function showModeWin(title){
    G.state = "win";
    logAttempt("win");
    recordDailyRun("win");
    accumulateStats();
    checkAchievements();
    const bonus = Math.round(payout(G.room, "exit") * (G.mode==="campaign"?1.6:1.2));
    addCurrency(bonus);
    const s = loadSave();
    if (G.mode === "campaign") s.best.campaignWin = true;
    if (G.mode === "arena") s.best.arena = Math.max(s.best.arena||0, Math.floor(G.runTime));
    if (G.mode === "bossrush") s.best.bossrush = Math.max(s.best.bossrush||0, G.room);
    if (G.mode === "challenge") s.best.challenge = Math.max(s.best.challenge||0, G.room);
    saveSave(s);
    G.save = s;
    SFX.win();
    const hexLine = G.hexes.length
      ? G.hexes.map(id=>`${HEX_BY_ID[id].name} Lv${G.hexLevels[id]||1}`).join(" · ")
      : "无海克斯";
    overlayCard.innerHTML = `
      <h1 class="win">${title}</h1>
      <p>模式 <strong>${MODE_BY_ID[G.mode]?.name||G.mode}</strong> · 深度 ${G.room} · Lv.${G.level} · 局时 ${G.runTime.toFixed(1)}s</p>
      <p>击败 <strong>${G.kills}</strong> · 破防 <strong>${G.breaks}</strong> · 结算 <strong style="color:#5dffb0">◆${bonus}</strong></p>
      <p style="font-size:12px;color:#d7a6ff">${hexLine}</p>
      ${G.modeMods.length?`<p style="font-size:12px;color:#8b97b0">词条：${G.modeMods.map(id=>CUSTOM_BY_ID[id]?.name||id).join(" · ")}</p>`:""}
      <div class="action-row">
        <button type="button" class="action-btn" data-act="restart">再来一局</button>
        <button type="button" class="action-btn ghost" id="win-modes">回模式选择</button>
      </div>
    `;
    overlay.classList.add("show");
    bindOverlayActions();
    const bm = document.getElementById("win-modes");
    if (bm) bm.onclick = (e)=>{ e.preventDefault(); e.stopPropagation(); showModeSelect(); };
  }

  function openExit(depth){
    G.state = "exit";
    G.exitDepth = depth;
    G.exitIndex = 0;
    renderExit();
  }

  function renderExit(){
    const d = G.exitDepth;
    const take = payout(d, "exit");
    const nextK = Math.floor((d + CFG.exitEvery) / CFG.exitEvery);
    const nextIfClear = Math.round(CFG.exitPayoutBase * Math.pow(nextK, CFG.exitPayoutPow));
    const risk = G.waveMul;
    overlayCard.innerHTML = `
      <h1 class="win" style="font-size:24px">出口节点 · 深度 ${d}</h1>
      <p style="font-size:13px;color:#8b97b0">◆ 是<strong style="color:#5dffb0">局外货币</strong>：可在标题页买解锁（四选一 / 治疗预算 / 开局银章）。死亡只拿 55%。</p>
      <p style="font-size:14px;color:#eef3ff;margin:12px 0">
        现在拿走入库：<strong style="color:#5dffb0">◆ ${take}</strong><br/>
        再打到深度 ${d + CFG.exitEvery} 再结算：预估 <strong style="color:#ffd27a">◆ ${nextIfClear}</strong>
        （更赚，但死了只剩 ${Math.round(nextIfClear*CFG.deathPayoutMul)}）
      </p>
      <div class="variant">
        <button id="ex-take" class="${G.exitIndex===0?"active":""}" style="pointer-events:auto;cursor:pointer;border:1px solid ${G.exitIndex===0?"#5dffb0":"#35507a"};background:#121a2c;color:#eef3ff;padding:10px 18px;font-family:inherit">拿走结算</button>
        <button id="ex-go" class="${G.exitIndex===1?"active":""}" style="pointer-events:auto;cursor:pointer;border:1px solid ${G.exitIndex===1?"#ffd27a":"#35507a"};background:#121a2c;color:#eef3ff;padding:10px 18px;font-family:inherit">继续深入</button>
      </div>
      <div class="hint"><span>←→ 选择 · Enter 确认</span></div>
    `;
    overlay.classList.add("show");
    const t = document.getElementById("ex-take");
    const g = document.getElementById("ex-go");
    if (t) t.onclick = ()=>{ G.exitIndex=0; confirmExit(); };
    if (g) g.onclick = ()=>{ G.exitIndex=1; confirmExit(); };
  }

  function confirmExit(){
    if (G.exitIndex === 0){
      recordDailyRun("exit");
      const gain = settle("exit");
      toast(`已结算 ◆${gain} · 图鉴已更新`, 2.2);
      G.state = "title";
      overlay.classList.remove("show");
      setTimeout(()=>showTitle(), 60);
    } else {
      // 继续深入：关窗并进下一层
      overlay.classList.remove("show");
      beginRoom(false);
    }
  }

  function grantExp(amount){
    G.exp += amount;
    checkLevelUp();
  }

  function checkLevelUp(){
    let leveled = false;
    while (G.exp >= G.expNext){
      G.exp -= G.expNext;
      G.level += 1;
      leveled = true;
      G.expNext = Math.round(CFG.expBase + CFG.expGrow * Math.pow(G.level - 1, 1.15));
      rebuildCfg();
      const baseMax = (G.C||CFG).playerMaxHp + (G.level-1)*CFG.levelHpPer;
      const gained = baseMax - player.maxHp;
      player.maxHp = baseMax;
      if (gained > 0) player.hp = Math.min(player.maxHp, player.hp + gained);
      const dmgPct = Math.round((G.C.dmgMulLevel || 0) * 100);
      floatText(player.x, player.y-40, "Lv."+G.level+"  +"+gained+"HP  伤+"+dmgPct+"%", "#7dffc2", 14);
      ring(player.x, player.y, 46, "#5ecbff", 0.4, 3);
      burst(player.x, player.y, "#5ecbff", 12, 130, 0.35);
      tone(520, 0.1, "triangle", 0.04, 720);
      // 每 2 级一次海克斯（M-06）
      if (G.level % 2 === 0){
        G.levelUpPending += 1;
      }
    }
    if (leveled) maybeOpenLevelHex();
    checkAchievements();
  }

  function maybeOpenLevelHex(){
    if (G.state !== "playing") return;
    if (G.levelUpPending <= 0) return;
    if (G.roomClearing) return;
    G.levelUpPending -= 1;
    openHexPick("playing");
  }

  // 旧接口兼容
  function spawnCombat(){
    beginRoom(true);
  }

  // 统一绑定结算/选择界面的可点按钮（与键盘等价）
  function bindOverlayActions(){
    overlayCard.querySelectorAll("[data-act]").forEach(btn=>{
      btn.onclick = (e)=>{
        e.preventDefault();
        e.stopPropagation();
        const act = btn.dataset.act;
        if (act === "restart"){
          if (G.state === "dead" || G.state === "win" || G.state === "dying" || G.state === "playing"){
            G.attempt += 1;
            startRun(G.mode || "endless");
          }
        } else if (act === "title"){
          G.state = "title";
          overlay.classList.remove("show");
          setTimeout(()=>showTitle(), 40);
        } else if (act === "skipHex"){
          if (G.state === "hexPick") skipHexPick();
        }
      };
    });
  }

  function showDeath(){
    G.state="dead";
    const k=G.killer;
    logAttempt("death");
    const dEntry = recordDailyRun("death");
    accumulateStats();
    checkAchievements();
    const gain = settle("death");
    const hexLine = G.hexes.length
      ? G.hexes.map(id=>{
          const h=HEX_BY_ID[id];
          return `${h.name} Lv${G.hexLevels[id]||1}`;
        }).join(" · ")
      : "无海克斯";
    const klassName = G.klass==="melee" ? "近战「刃」" : G.klass==="bulwark" ? "坦克「盾」" : "远程「弦」";
    const s = loadSave();
    overlayCard.innerHTML = `
      <h1 class="danger">你倒下了</h1>
      <div class="killer">
        <div class="k-label">死因归因</div>
        <div class="k-name">${k?k.name+" · "+k.action:"未知"}</div>
        <div class="k-tip">${k?k.tip:"观察双通道前摇后再闪避。"}</div>
      </div>
      <p>角色 <strong>${klassName}</strong> · 深度 <strong>第 ${G.room} 层</strong> · Lv.${G.level} · 局时 ${G.runTime.toFixed(1)}s</p>
      <p>击败 <strong>${G.kills}</strong> · 破防 <strong>${G.breaks}</strong> · 结算 <strong style="color:#5dffb0">◆${gain}</strong>（55%）</p>
      <p style="font-size:12px">本局世界：<strong style="color:#d7a6ff">${hexLine}</strong></p>
      <p style="font-size:12px;color:#8b97b0">累计 ◆${s.currency||0} · 最深 ${s.best?.depth||G.room} · 攀升 ${G.ascension||0}</p>
      ${dEntry?`<p style="font-size:13px;color:#ffb3e0">每日积分 <strong>${dEntry.score}</strong> · 已记入今日排行</p>`:""}
      <div class="action-row">
        <button type="button" class="action-btn" data-act="restart">立即重开</button>
        <button type="button" class="action-btn ghost" data-act="title">回标题</button>
      </div>
      <div class="hint" style="margin-top:8px"><span>键盘：R 重开 · Esc 回标题</span></div>
    `;
    overlay.classList.add("show");
    bindOverlayActions();
  }

  function showWin(){
    logAttempt("win");
    SFX.win();
    const hexLine = G.hexes.length
      ? G.hexes.map(id=>{
          const h=HEX_BY_ID[id];
          return `${h.name} Lv${G.hexLevels[id]||1}`;
        }).join(" · ")
      : "无海克斯";
    overlayCard.innerHTML = `
      <h1 class="win">房间肃清</h1>
      <p>你开始在「安排攻击发生的顺序」，而不只是躲。</p>
      <p>用时 <strong>${G.runTime.toFixed(1)}s</strong> · 破防 <strong>${G.breaks}</strong> · 受击 <strong>${G.tel.hitsTaken}</strong> · 剩余生命 <strong>${Math.ceil(player.hp)}</strong></p>
      <p style="font-size:12px">本局世界：<strong style="color:#d7a6ff">${hexLine}</strong></p>
      <p style="font-size:12px">主动接近比 <strong style="color:#5ecbff">${(G.tel.ratio*100).toFixed(1)}%</strong></p>
      <div class="action-row">
        <button type="button" class="action-btn" data-act="restart">再来一局</button>
        <button type="button" class="action-btn ghost" data-act="title">回标题</button>
      </div>
    `;
    overlay.classList.add("show");
    bindOverlayActions();
  }

  function restartFromAnywhere(){
    if (G.state==="title"){ startRun(); return; }
    if (G.state==="hexPick"){ skipHexPick(); return; }
    // [P0] playing 中按 R 也必须写 ringLog，否则会丢掉「放弃局」样本
    if (G.state==="playing" || G.state==="dying"){
      logAttempt("abandon");
      G.attempt+=1;
      startRun();
      return;
    }
    G.attempt+=1;
    startRun();
  }

  function logAttempt(reason){
    if (G.runTime < 1) return;
    G.ringLog.push({
      attempt: G.attempt,
      reason,
      room: G.room,
      level: G.level,
      exp: G.exp,
      ratio: G.tel.ratio,
      time: G.runTime,
      kills: G.kills,
      breaks: G.breaks,
      hits: G.tel.hitsTaken,
      dodgeSuccess: G.tel.dodgeSuccess||0,
      hexes: G.hexes.slice(),
      hexLevels: Object.assign({}, G.hexLevels),
      windupHits: G.hexCounters.windupHits||0,
    });
  }

  function startRun(modeId){
    ensureAudio();
    if (modeId) G.mode = modeId;
    if (!G.mode) G.mode = "endless";
    G.hexes = [];
    G.hexLevels = {};
    G.hexCounters = {};
    G.hexOffer = [];
    G.hexPickCountTotal = 0;
    G.room = 1;
    G.roomTime = 0;
    G.runTime = 0;
    G.level = 1;
    G.exp = 0;
    G.expNext = CFG.expBase;
    G.levelUpPending = 0;
    G.kills = 0;
    G.breaks = 0;
    G.heals = 0;
    G.waveMul = 1;
    G.roomClearing = false;
    G.hexResume = null;
    G.noHitRooms = 0;
    G.telByRoom = [];
    G.timeStopTimer = 0;
    G.timeStopCd = 0;
    G.expPenalty = 1;
    G.modeScore = 0;
    G.modeTimer = 0;
    G.save = loadSave();
    G.ascension = (G.save && G.save.ascension) || 0;
    G.rng = null;
    if (G.mode === "daily"){
      if (!G.modeSeed) G.modeSeed = dailySeedFromDate();
      if (!G.modeDailyDate) G.modeDailyDate = dailyDateStr();
      G.rng = mulberry32(G.modeSeed);
    } else if (G.mode === "challenge" && G.modeSeed){
      G.rng = mulberry32(G.modeSeed >>> 0);
    }
    rebuildCfg();
    if (hasMeta("start_hex") && !(G.C && G.C.hexDisabled)){
      const silvers = HEX_POOL.filter(h => h.tier === "silver" && !(h.only && h.only !== G.klass));
      if (silvers.length){
        const h = silvers[(Math.random()*silvers.length)|0];
        if (!G.hexes.includes(h.id)){
          G.hexes.push(h.id);
          G.hexLevels[h.id] = 1;
          rebuildCfg();
        }
      }
    }
    const label = MODE_BY_ID[G.mode]?.name || G.mode;
    toast(`${label}${G.modeChallenge ? " · " + G.modeChallenge : ""}${G.modeMods.length ? " · " + G.modeMods.length + " 词条" : ""}`, 2);
    if ((G.C||CFG).hexDisabled){
      beginCombat();
      return;
    }
    openHexPick("start");
  }

  function handleDeaths(){
    for (const e of enemies){
      if (e.hp<=0 && !e._looted){
        e._looted=true;
        G.kills+=1;
        G.roomKills+=1;
        bumpHexCounter("kills", 1);
        if (G.mode==="arena") G.modeScore += 8;
        checkAchievements();
        applyKillHeal();
        const expMap = {
          grunt: CFG.expGrunt,
          caster: CFG.expCaster,
          dasher: CFG.expDasher,
          elite: CFG.expElite,
        };
        const exp = Math.round((expMap[e.type] || 20) * (G.expPenalty || 1));
        grantExp(exp);
        if (player.counterWindow > 0) bumpHexCounter("dodgeKills", 1);
        const col = e.type==="elite" ? "#ffd27a" : e.type==="dasher" ? "#ff8a5c" : e.type==="caster" ? "#b07dff" : "#ff8a5c";
        burst(e.x,e.y,col, e.type==="elite"?28:18, 200, 0.45);
        floatText(e.x,e.y-28,"+"+exp+" XP","#7dffc2",12);
        shake(e.type==="elite"?10:6); hitstop(e.type==="elite"?120:80); G.slowmo=0.12;
        const healChance = (G.C||CFG).healChance || 0.4;
        if (G.healBudget > 0 && Math.random() < healChance){
          G.healBudget -= 1;
          G.drops.push({x:e.x+rand(-10,10), y:e.y+rand(-10,10), r:5, life:5, pulse:rand(0,6)});
        }
      }
    }
  }

  // 测试钩子：自动化试玩用（不影响正常游玩）
  window.__RG = {
    get G(){ return G; },
    get player(){ return player; },
    get enemies(){ return enemies; },
    get HEX_BY_ID(){ return HEX_BY_ID; },
    get HEX_POOL(){ return HEX_POOL; },
    get MODES(){ return MODES; },
    showTitle(){ G.state = "title"; showTitle(); },
    showModeSelect(){ showModeSelect(); },
    start(mode){ startRun(mode); },
    skipHex(){ if (G.state==="hexPick") skipHexPick(); },
    applyHex(i){ if (G.state==="hexPick"){ G.hexPickIndex=i||0; applyHexPick(); } },
    forceClear(){
      for (const e of enemies) e.hp = 0;
      G.spawnQueue = [];
    },
    killSelf(name, action, tip){
      player.alive = true;
      player.hp = 1;
      player.invuln = 0;
      player.dodgeTimer = 0;
      damagePlayer(999, { name: name || "测试", action: action || "自测" }, tip || "自动化验收");
    },
    continueExit(){
      if (G.state==="exit"){ G.exitIndex=1; confirmExit(); return true; }
      return false;
    },
    takeExit(){
      if (G.state==="exit"){ G.exitIndex=0; confirmExit(); return true; }
      return false;
    },
    skipLevelHex(){
      if (G.state==="hexPick") skipHexPick();
    },
    stats(){
      return {
        state: G.state,
        room: G.room,
        level: G.level,
        exp: G.exp,
        hp: player.hp,
        maxHp: player.maxHp,
        kills: G.kills,
        overlay: document.getElementById("overlay").classList.contains("show"),
        hexes: G.hexes.slice(),
        waveMul: G.waveMul,
        enemies: enemies.filter(e=>e.hp>0).map(e=>({type:e.type,hp:e.hp,maxHp:e.maxHp})),
        queue: G.spawnQueue.slice(),
      };
    },
  };

  // ========== 作者署名嵌入（多层，防剥离）==========
  // 破防之隙 / POISE · Developer IDKURLOVE · https://github.com/IDKURLOVE
  // 禁止删除本段、画布水印与 DOM 徽标后用于二次牟利。
  const __LICENSE = (() => {
    const s = [73,68,75,85,82,76,79,86,69]; // IDKURLOVE
    const url = [104,116,116,112,115,58,47,47,103,105,116,104,117,98,46,99,111,109,47,80,79,80,79,117,108,116];
    return {
      author: String.fromCharCode(...s),
      url: String.fromCharCode(...url),
      game: "POISE / 破防之隙",
      year: 2026,
    };
  })();

  function ensureCreditDom(){
    const shell = document.getElementById("shell");
    if (!shell) return;
    let el = document.getElementById("dev-credit");
    if (!el){
      el = document.createElement("a");
      el.id = "dev-credit";
      el.className = "dev-credit";
      el.target = "_blank";
      el.rel = "noopener noreferrer";
      el.href = __LICENSE.url;
      el.innerHTML = `Dev <strong>${__LICENSE.author}</strong> · GitHub`;
      shell.appendChild(el);
      return; // 新建后本轮结束，避免 Mutation 风暴
    }
    if (el.getAttribute("href") !== __LICENSE.url) el.href = __LICENSE.url;
    if (el.textContent.indexOf(__LICENSE.author) < 0){
      el.innerHTML = `Dev <strong>${__LICENSE.author}</strong> · GitHub`;
    }
    if (el.style.display === "none") el.style.display = "";
  }

  function drawCreditWatermark(){
    ctx.save();
    ctx.globalAlpha = 0.22;
    ctx.font = "10px Segoe UI, Microsoft YaHei, sans-serif";
    ctx.fillStyle = "#8b97b0";
    ctx.textAlign = "right";
    ctx.fillText(`© ${__LICENSE.year} ${__LICENSE.author}`, CFG.roomW - 10, CFG.roomH - 8);
    ctx.restore();
  }

  // 低频守卫（不挂 attributes，避免自触发死循环）
  try {
    let creditGuardLock = false;
    const mo = new MutationObserver(() => {
      if (creditGuardLock) return;
      creditGuardLock = true;
      setTimeout(() => { creditGuardLock = false; ensureCreditDom(); }, 400);
    });
    mo.observe(document.getElementById("shell") || document.body, { childList: true });
  } catch(e){}
  setInterval(() => {
    if (!document.getElementById("dev-credit")) ensureCreditDom();
  }, 2000);
  ensureCreditDom();

  console.info(
    `%c${__LICENSE.game}%c\nDeveloper: ${__LICENSE.author}\n${__LICENSE.url}\nSupported by MiMo-X-Pro-Preview\n保留署名；移除后商用属侵权。`,
    "color:#5dffb0;font-weight:bold;font-size:14px",
    "color:#8b97b0"
  );

  // 挂到全局但只读（简单防误删）
  try {
    Object.defineProperty(window, "__POISE_CREDIT", {
      value: Object.freeze({ ...__LICENSE }),
      writable: false,
      configurable: false,
    });
  } catch(e){ window.__POISE_CREDIT = { ...__LICENSE }; }

  showTitle();
  requestAnimationFrame(loop);
})();
  </script>
</body>
