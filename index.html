<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>破防之隙 · 无尽模式</title>
  <style>
    :root {
      --bg: #07090f;
      --panel: #0e1320;
      --panel-2: #141b2c;
      --ink: #eef3ff;
      --muted: #8b97b0;
      --line: #24314a;
      --accent: #5dffb0;
      --accent-dim: #2d9b6e;
      --danger: #ff5d6c;
      --warn: #ffb347;
      --info: #5ecbff;
      --violet: #b07dff;
      --shadow: rgba(0,0,0,.55);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background:
        radial-gradient(1200px 700px at 50% 40%, #121a2b 0%, #07090f 62%),
        #07090f;
      color: var(--ink);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      user-select: none;
    }
    #app { width: 100%; height: 100%; display: grid; place-items: center; position: relative; }
    #shell {
      position: relative;
      width: min(1040px, 100vw);
      height: min(700px, 100vh);
      background: #090c14;
      border: 1px solid #1c2740;
      box-shadow:
        0 0 0 1px #000,
        0 0 60px rgba(70, 120, 255, .08),
        0 30px 80px rgba(0,0,0,.65);
      overflow: hidden;
    }
    canvas { display: block; width: 100%; height: 100%; background: transparent; }
    #hud {
      position: absolute; inset: 0; pointer-events: none; z-index: 3;
      padding: 16px 18px;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
    .glass {
      background: linear-gradient(180deg, rgba(16,22,36,.82), rgba(10,14,24,.72));
      border: 1px solid rgba(70, 100, 150, .35);
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 28px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.04);
    }
    .hp-card { min-width: 240px; padding: 12px 14px 12px; }
    .left-col {
      display: flex; flex-direction: column; gap: 8px;
      align-items: flex-start; max-width: 270px; min-width: 240px;
    }
    .kicker {
      font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 8px; font-weight: 600;
    }
    .hp-track {
      height: 12px; border-radius: 999px; background: #151d2e; overflow: hidden;
      border: 1px solid #2a3852; position: relative;
    }
    .hp-fill {
      height: 100%; width: 100%; border-radius: inherit;
      background: linear-gradient(90deg, #2fe08a, #7dffc2 55%, #c8ffe8);
      box-shadow: 0 0 18px rgba(93,255,176,.45);
      transition: width .1s ease-out;
    }
    .hp-fill.mid { background: linear-gradient(90deg, #f0b429, #ffd27a); box-shadow: 0 0 18px rgba(255,179,71,.35); }
    .hp-fill.low { background: linear-gradient(90deg, #ff4d5e, #ff8a96); box-shadow: 0 0 18px rgba(255,93,108,.4); }
    .hp-meta { margin-top: 7px; display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .hp-meta strong { color: var(--ink); font-weight: 600; }
    .stats { padding: 12px 14px; text-align: right; min-width: 160px; }
    .stats div { font-size: 12px; color: var(--muted); line-height: 1.65; font-variant-numeric: tabular-nums; }
    .stats strong { color: var(--ink); font-weight: 600; }
    .bottom { align-items: flex-end; }
    .keys { padding: 12px 14px; font-size: 12px; color: var(--muted); line-height: 1.8; max-width: 420px; }
    .keys kbd {
      display: inline-block; min-width: 20px; padding: 1px 6px; margin: 0 1px;
      border: 1px solid #35507a; background: #121a2b; color: var(--ink);
      font-size: 10px; border-radius: 3px; font-family: inherit;
    }
    .obj { padding: 12px 14px; text-align: right; min-width: 200px; }
    .obj .big { color: var(--ink); font-size: 14px; font-weight: 600; margin-top: 2px; }
    .obj .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
    #poise-hint {
      position: absolute; left: 50%; bottom: 92px; transform: translateX(-50%);
      z-index: 3; pointer-events: none; opacity: 0; transition: opacity .2s ease;
      padding: 8px 14px; border-radius: 999px;
      background: rgba(12, 40, 30, .88); border: 1px solid #2f9b6a;
      color: #9dffc8; font-size: 12px; letter-spacing: .04em;
    }
    #poise-hint.show { opacity: 1; }
    #toast {
      position: absolute; left: 50%; top: 16%; transform: translateX(-50%);
      z-index: 4; pointer-events: none; opacity: 0; transition: opacity .2s ease;
      padding: 10px 16px; color: var(--ink);
      background: rgba(10,14,24,.9); border: 1px solid #2f4570;
      font-size: 13px; white-space: nowrap;
      box-shadow: 0 10px 30px rgba(0,0,0,.4);
    }
    #toast.show { opacity: 1; }
    #overlay {
      position: absolute; inset: 0; z-index: 5; display: grid; place-items: center;
      background: radial-gradient(800px 500px at 50% 45%, rgba(12,18,32,.55), rgba(5,7,12,.88));
      opacity: 0; pointer-events: none; transition: opacity .28s ease;
    }
    #overlay.show { opacity: 1; pointer-events: auto; }
    .card {
      width: min(520px, 94%);
      max-height: min(92vh, 900px);
      overflow-y: auto;
      overflow-x: hidden;
      background: linear-gradient(180deg, #121a2c, #0c121e);
      border: 1px solid #2a3c5e;
      padding: 28px 28px 22px;
      box-shadow: 0 24px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.03) inset;
      text-align: center;
    }
    .card::-webkit-scrollbar { width: 8px; }
    .card::-webkit-scrollbar-thumb { background: #2a3c5e; border-radius: 4px; }
    .card::-webkit-scrollbar-track { background: transparent; }
    .card h1 { font-size: 30px; font-weight: 700; letter-spacing: .06em; margin-bottom: 10px; }
    .card h1.danger { color: var(--danger); text-shadow: 0 0 24px rgba(255,93,108,.35); }
    .card h1.win { color: var(--accent); text-shadow: 0 0 24px rgba(93,255,176,.3); }
    .card h1.idle { color: #9ecbff; text-shadow: 0 0 24px rgba(94,203,255,.25); }
    .card p { color: var(--muted); font-size: 14px; line-height: 1.7; margin-bottom: 10px; }
    .card p strong { color: var(--ink); }
    .tagrow { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 14px 0 6px; }
    .tag {
      font-size: 11px; letter-spacing: .04em; padding: 5px 10px;
      border: 1px solid #2f456e; color: #b7c6e0; background: #10182a;
    }
    .killer {
      margin: 16px 0 8px; padding: 14px; text-align: left;
      background: linear-gradient(180deg, #1a1016, #120c11);
      border: 1px solid #5a2834;
    }
    .killer .k-label { font-size: 11px; color: #ff8a96; letter-spacing: .1em; margin-bottom: 4px; font-weight: 700; }
    .killer .k-name { font-size: 16px; font-weight: 700; color: #ffc0c6; }
    .killer .k-tip { margin-top: 6px; font-size: 13px; color: var(--muted); line-height: 1.55; }
    .hint { margin-top: 18px; font-size: 12px; color: var(--accent); }
    .hint span {
      display: inline-block; border: 1px solid #2d7a58; background: #0e2419;
      padding: 6px 12px; margin-top: 6px; color: #9dffc8;
    }
    .variant {
      margin: 12px auto 0; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
      pointer-events: auto;
    }
    .variant button {
      pointer-events: auto;
      cursor: pointer; border: 1px solid #35507a; background: #121a2c; color: var(--ink);
      padding: 8px 12px; font-size: 12px; font-family: inherit;
    }
    .variant button.active {
      border-color: #2f9b6a; color: #9dffc8; background: #0f2419;
      box-shadow: 0 0 0 1px rgba(93,255,176,.15);
    }
    .variant button:hover { border-color: #6d9dff; }
    .start-btn {
      pointer-events: auto;
      cursor: pointer;
      margin-top: 14px;
      width: 100%;
      padding: 12px 18px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .08em;
      color: #06140f;
      background: linear-gradient(180deg, #7dffc2, #3dd68c);
      border: 1px solid #9dffc8;
      box-shadow: 0 0 24px rgba(93,255,176,.25);
      transition: transform .12s ease, filter .12s ease;
    }
    .start-btn:hover { filter: brightness(1.06); }
    .start-btn:active { transform: scale(0.98); }
    .action-btn {
      pointer-events: auto;
      cursor: pointer;
      display: inline-block;
      margin: 6px 6px 0;
      padding: 10px 16px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      color: #eef3ff;
      background: #121a2c;
      border: 1px solid #2d7a58;
      color: #9dffc8;
      transition: transform .12s ease, filter .12s ease;
    }
    .action-btn:hover { filter: brightness(1.12); border-color: #5dffb0; }
    .action-btn:active { transform: scale(0.97); }
    .action-btn.ghost {
      border-color: #35507a;
      color: #b7c6e0;
    }
    .action-btn.ghost:hover { border-color: #6d9dff; color: #eef3ff; }
    .action-row { margin-top: 14px; }
    #debug {
      position: absolute; right: 12px; top: 12px; z-index: 4; display: none;
      padding: 10px 12px; min-width: 220px;
      font-size: 11px; color: #b7c6e0; line-height: 1.55;
      pointer-events: none;
    }
    #debug.show { display: block; }
    .brand {
      position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
      z-index: 3; pointer-events: none;
      font-size: 11px; letter-spacing: .28em; color: rgba(160,180,210,.35);
      text-transform: uppercase; font-weight: 600;
    }
    .dev-credit {
      position: absolute; right: 14px; top: 36px; z-index: 7;
      pointer-events: auto;
      font-size: 11px;
      color: #7f8eaa;
      background: rgba(8, 12, 20, .78);
      border: 1px solid #24314a;
      padding: 4px 10px;
      border-radius: 4px;
      text-decoration: none;
      letter-spacing: .04em;
      white-space: nowrap;
    }
    .dev-credit:hover { color: #9dffc8; border-color: #2d7a58; }
    .dev-credit strong { color: #b7c6e0; font-weight: 600; }
    .dev-credit.faint {
      font-size: 10px; opacity: .55; padding: 2px 6px;
    }
    #hex-hud {
      display: none; gap: 6px; flex-direction: column;
      max-width: 260px; width: 100%;
      pointer-events: none;
    }
    #hex-hud.show { display: flex; }
    .hex-chip {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 10px;
      background: rgba(10,14,24,.82);
      border: 1px solid #2a3c5e;
      font-size: 12px; color: var(--ink);
    }
    .hex-chip .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--c, #fff);
      box-shadow: 0 0 10px var(--c, #fff);
      flex-shrink: 0;
    }
    .hex-chip .lv {
      margin-left: auto; color: var(--muted); font-size: 11px;
    }
    .hex-cards {
      display: grid; grid-template-columns: 1fr; gap: 10px; margin: 14px 0 8px;
      text-align: left;
    }
    #mode-cards, #ch-cards, #ach-list, #cm-cards {
      scrollbar-width: thin;
      scrollbar-color: #2a3c5e transparent;
    }
    #mode-cards::-webkit-scrollbar, #ch-cards::-webkit-scrollbar,
    #ach-list::-webkit-scrollbar, #cm-cards::-webkit-scrollbar { width: 8px; }
    #mode-cards::-webkit-scrollbar-thumb, #ch-cards::-webkit-scrollbar-thumb,
    #ach-list::-webkit-scrollbar-thumb, #cm-cards::-webkit-scrollbar-thumb {
      background: #2a3c5e; border-radius: 4px;
    }
    .hex-card {
      border: 1px solid #2a3c5e; background: #0f1524;
      padding: 12px 14px; cursor: pointer;
      transition: border-color .15s, background .15s;
      pointer-events: auto;
      user-select: none;
    }
    .hex-card:hover, .hex-card.sel {
      border-color: var(--hc, #5ecbff);
      background: #141c30;
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--hc, #5ecbff) 35%, transparent);
    }
    .hex-card:active { transform: scale(0.985); }
    .hex-card .hx-top {
      display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
      margin-bottom: 4px;
    }
    .hex-card .hx-name { font-size: 15px; font-weight: 700; color: var(--hc, #fff); }
    .hex-card .hx-tag { font-size: 11px; color: var(--muted); }
    .hex-card .hx-desc { font-size: 13px; color: #c9d6ee; line-height: 1.5; }
    .hex-card .hx-cost {
      margin-top: 6px; font-size: 12px; color: #ff9aa6;
    }
    .hex-card .hx-up {
      margin-top: 4px; font-size: 11px; color: #8b97b0;
    }
    .mode-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0; text-align: left; }
    .mode-card {
      border: 1px solid #2a3c5e; background: #0f1524; padding: 14px; cursor: pointer;
      transition: border-color .15s, background .15s; min-height: 120px;
    }
    .mode-card:hover, .mode-card.sel { border-color: #5ecbff; background: #141c30; }
    .mode-card.locked { opacity: .45; filter: grayscale(.6); }
    .mode-card h3 { font-size: 15px; margin-bottom: 6px; color: #eef3ff; }
    .mode-card p { font-size: 12px; color: #8b97b0; line-height: 1.5; }
    .currency-chip {
      position: absolute; right: 18px; top: 78px; z-index: 3; pointer-events: none;
      padding: 6px 10px; font-size: 12px; color: #ffd27a;
      background: rgba(10,14,24,.85); border: 1px solid #5a4a28;
    }
    .exit-list { text-align: left; margin: 12px 0; }
    .exit-row {
      display: flex; justify-content: space-between; gap: 12px;
      padding: 8px 10px; border-bottom: 1px solid #1e2a40; font-size: 13px; color: #c9d6ee;
    }
    .exit-row span:last-child { color: #ffd27a; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div id="app">
    <div id="shell">
      <canvas id="game" width="1040" height="700"></canvas>
      <div class="brand">POISE // 破防之隙</div>
      <a id="dev-credit" class="dev-credit" href="https://github.com/IDKURLOVE" target="_blank" rel="noopener noreferrer">Dev <strong>IDKURLOVE</strong> · GitHub</a>
      <div id="currency-chip" style="position:absolute;right:18px;top:14px;z-index:3;display:none;padding:4px 10px;background:rgba(10,14,24,.85);border:1px solid #2d5a48;color:#5dffb0;font-size:12px;letter-spacing:.04em"></div>
      <div id="hud">
        <div class="row">
          <div class="left-col">
            <div class="glass hp-card">
              <div class="kicker">生命 / VITALS</div>
              <div class="hp-track"><div class="hp-fill" id="hp-fill"></div></div>
              <div class="hp-meta">
                <span id="hp-text">100 / 100</span>
                <span>闪避 <strong id="dodge-text">就绪</strong></span>
              </div>
              <div class="kicker" style="margin-top:10px">等级 / XP</div>
              <div class="hp-track" style="height:8px"><div class="hp-fill" id="xp-fill" style="width:0%;background:linear-gradient(90deg,#5ecbff,#9dceff);box-shadow:0 0 12px rgba(94,203,255,.4)"></div></div>
              <div class="hp-meta">
                <span id="level-text">Lv.1</span>
                <span id="xp-text">0 / 120</span>
              </div>
            </div>
            <div id="hex-hud"></div>
          </div>
          <div class="glass stats" id="stats">
            <div>层数 <strong id="stat-room">1</strong></div>
            <div>击败 <strong id="stat-kills">0</strong></div>
            <div>破防 <strong id="stat-breaks">0</strong></div>
            <div>时间 <strong id="stat-time">0.0s</strong></div>
            <div>◆ <strong id="stat-currency">0</strong></div>
          </div>
        </div>
        <div class="row bottom">
          <div class="glass keys">
            <div><kbd>WASD</kbd> 移动　<kbd>Space</kbd> 闪避　<kbd>J</kbd>/左键 轻击　<kbd>K</kbd>/右键 重击　<kbd>Esc</kbd> 暂停</div>
            <div style="margin-top:2px">R 重开　·　无尽：清层进下一层，血量跨层保留</div>
          </div>
          <div class="glass obj">
            <div class="kicker">无尽</div>
            <div class="big" id="obj-text">第 1 层</div>
            <div class="sub" id="obj-sub">场上 0</div>
          </div>
        </div>
      </div>
      <div id="toast"></div>
      <div id="poise-hint">破防窗口 · 伤害 ×1.5 · 贴脸削韧加成已激活</div>
      <div class="glass" id="debug"></div>
      <div id="overlay" class="show">
        <div class="card" id="overlay-card"></div>
      </div>
    </div>
  </div>

  <script>
(() => {
  "use strict";

  // PT-1 方法学：?pt=1 关闭会泄露机制答案的文案（PH-02 需要玩家自己发现破防价值）
  const PT_MODE = new URLSearchParams(location.search).get("pt")==="1";
  if (PT_MODE) {
    document.getElementById("poise-hint").textContent = "破防 · 趁它僵直输出";
    const keyHint = document.querySelector(".keys div:last-child");
    if (keyHint) keyHint.textContent = "前摇 = 亮色填充 + 轮廓脉冲　·　贴脸削韧更高";
  }

  // ========== GDD v1.0 参数 ==========
  // 身位：以玩家碰撞直径为 1.0 身位；速度用「基准像素/秒」表达相对比例
  const BODY = 40; // px，1 身位
  const CFG = {
    roomW: 1040,
    roomH: 700,
    pad: 36,

    playerR: BODY * 0.5,          // 0.5 身位
    playerSpeed: 250,             // 基准 1.00
    playerMaxHp: 100,

    // 轻击
    lightWindup: 0.10,
    lightActive: 0.08,
    lightRecover: 0.18,
    lightDmg: 10,
    lightPoise: 4,
    lightRange: BODY * 1.55,
    lightArc: Math.PI * 0.85,

    // 重击
    heavyWindup: 0.34,
    heavyActive: 0.10,
    heavyRecover: 0.42,
    heavyDmg: 26,
    heavyPoise: 18,
    heavyRange: BODY * 1.85,
    heavyArc: Math.PI * 0.95,

    // 闪避
    dodgeStartup: 0.04,
    dodgeIFrame: 0.18,
    dodgeRecover: 0.03,
    dodgeTotal: 0.25,
    dodgeDistance: BODY * 2.2,    // 2.2 身位
    dodgeCooldown: 0.60,

    // 破防
    breakDmgMul: 1.5,
    firstBreakSlowmo: 0.22,
    // [约束] 仅轻击享受贴脸削韧加成，且系数不得使「贴脸重击」一击破防（18×mul > 20）
    closeRange: BODY * 1.5,
    closePoiseMul: 1.25,
    closePoiseHeavyMul: 1.0,

    hitstopLightMs: 70,
    hitstopHeavyMs: 95,
    hitstopBreakMs: 120,

    // Grunt —— HP 100 强制两轮破防，决策空间翻倍（PT-1 P0）
    // 一次破防约能打掉 40-55 血，打不死，必须再破一次
    gruntHp: 100,
    gruntPoise: 20,
    gruntSpeedMul: 0.70,
    gruntWindup: 0.65,
    gruntActive: 0.12,
    gruntRecover: 0.90,
    gruntDmg: 12,
    gruntAttackRange: BODY * 1.5,
    gruntBreakTime: 1.35,
    gruntR: BODY * 0.45,

    // Caster
    casterHp: 40,
    casterPoise: 12,
    casterSpeedMul: 0.50,
    casterWindup: 0.80,
    casterRecover: 0.55,
    casterDmg: 8,
    casterKeep: BODY * 5.0,
    casterProjSpeedMul: 1.6, // × 玩家速度
    casterBreakTime: 1.1,
    casterR: BODY * 0.4,
    casterCooldown: 1.2,
    fanCount: 3,
    fanSpread: 0.38, // rad 总扇面；间隙由间距保证 ≥1.2 身位

    // 远程角色（角色选择）
    rangerHp: 80,
    rangerSpeedMul: 1.08,
    rangerLightWindup: 0.06,
    rangerLightRecover: 0.10,
    rangerLightDmg: 9,
    rangerLightPoise: 3,
    rangerLightProjSpeed: 520,
    rangerHeavyWindup: 0.32,
    rangerHeavyRecover: 0.28,
    rangerHeavyDmg: 24,
    rangerHeavyPoise: 14,
    rangerHeavyProjSpeed: 420,
    rangerCloseMul: 1.0, // 远程无贴脸削韧收益

    // 坦克「盾」：高生命、慢、重击向、有格挡窗
    bulwarkHp: 140,
    bulwarkSpeedMul: 0.88,
    bulwarkLightDmg: 8,
    bulwarkLightPoise: 5,
    bulwarkHeavyDmg: 34,
    bulwarkHeavyPoise: 24,
    bulwarkHeavyWindup: 0.42,
    bulwarkBlockWindow: 0.18, // 闪避后 0.18s 减伤 70%
    bulwarkCloseMul: 1.35,

    // 无尽 · 波次
    waveBaseCount: 3,
    waveCountPerRoom: 0.45,
    waveMaxCount: 12,
    expGrunt: 22,
    expCaster: 28,
    expDasher: 32,
    expElite: 80,
    expRoomClear: 15,
    levelHpPer: 4,
    levelDmgPer: 0.04,

  function dailyDateStr(d){
    const x = d || new Date();
    return x.getFullYear() + "-" + String(x.getMonth()+1).padStart(2,"0") + "-" + String(x.getDate()).padStart(2,"0");
  }
  function dailySeedFromDate(d){
    const s = dailyDateStr(d);
    let h = 2166136261;
    for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function mulberry32(a){
    return function(){
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function gameRandom(){
    if (G.rng) return G.rng();
    return Math.random();
  }
  function dailyScore(depth, time, kills, win){
    // 深度主导，用时惩罚，通关加成
    let sc = depth * 100 + kills * 3;
    if (time > 0) sc = Math.round(sc * (1 + Math.min(400, 400 / (time/60+1))));
    if (win) sc = Math.round(sc * 1.25);
    return Math.max(0, sc);
  }
  function recordDaily(entry){
    const s = loadSave();
    s.daily = s.daily || [];
    s.daily.push(entry);
    // 只保留最近 30 条
    if (s.daily.length > 30) s.daily = s.daily.slice(-30);
    saveSave(s);
    G.save = s;
  }
  function dailyBoard(){
    const s = loadSave();
    const today = dailyDateStr();
    const rows = (s.daily||[]).filter(r => r.date === today);
    rows.sort((a,b)=> (b.score - a.score) || (a.time - b.time));
    return rows;
  }

    // 角色差异
    if (G.klass === "ranger") {
      C.playerMaxHp = CFG.rangerHp;
      C.playerSpeed = CFG.playerSpeed * CFG.rangerSpeedMul;
      C.lightWindup = CFG.rangerLightWindup;
      C.lightRecover = CFG.rangerLightRecover;
      C.lightDmg = CFG.rangerLightDmg;
      C.lightPoise = CFG.rangerLightPoise;

      C.closePoiseHeavyMul = CFG.rangerCloseMul;
      C.lightActive = 0.05;

      C.attackStyle = "ranged";
    } else if (G.klass === "bulwark") {
      C.playerMaxHp = CFG.bulwarkHp;
      C.playerSpeed = CFG.playerSpeed * CFG.bulwarkSpeedMul;
      C.lightDmg = CFG.bulwarkLightDmg;
      C.lightPoise = CFG.bulwarkLightPoise;

      C.playerMaxHp = CFG.playerMaxHp;
      C.attackStyle = "melee";
    }
    C.blockMul = C.blockMul || 1;
    C.blockWindow = C.blockWindow || 0;

    for (const id of G.hexes) {
      const h = HEX_BY_ID[id];
      if (!h) continue;
      const level = G.hexLevels[id] || 1;
      const before = C.enemyHpMul;
      h.apply(C, level);
      if (C.enemyHpMul / before > 3) C.enemyHpMul = before * 3;
    }

    // 攀升层级（M-21）
    const asc = ASCENSION[G.ascension || 0];
    if (asc && asc.apply) asc.apply(C);
    if (C.enemyHpMul > 12) C.enemyHpMul = 12;

    // 模式 / 自定义 / 挑战修饰器

    // 玻璃之刃强制最大生命

    G.C = C;
    return C;
  }

  function bumpHexCounter(key, n = 1) {
    G.hexCounters[key] = (G.hexCounters[key] || 0) + n;
    for (const id of G.hexes) {

      if (!h || !h.upgrade) continue;
      const level = G.hexLevels[id] || 1;
      if (level >= h.maxLevel) continue;
      if (h.upgrade.cond !== key) continue;
      if (G.hexCounters[key] >= h.upgrade.n) {
        G.hexLevels[id] = level + 1;
        rebuildCfg();
        onHexUpgrade(h);
      }
    }

  // ========== Audio (synth) ==========
  let actx = null;
  function ensureAudio(){
    if (!actx) {
      try { actx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e) {}
    }
    if (actx && actx.state === "suspended") actx.resume();

  function tone(freq, dur, type="sine", gain=0.05, slideTo=null){
    const a = ensureAudio(); if (!a) return;
    const o = a.createOscillator();
    const g = a.createGain();
    o.type = type; o.frequency.value = freq;
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), a.currentTime + dur);
    g.gain.value = 0;
    g.gain.linearRampToValueAtTime(gain, a.currentTime + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
    o.connect(g); g.connect(a.destination);
    o.start(); o.stop(a.currentTime + dur + 0.02);
  }
  function noise(dur=0.08, gain=0.04, filter=1200){
    const a = ensureAudio(); if (!a) return;
    const n = Math.floor(a.sampleRate * dur);
    const buf = a.createBuffer(1, n, a.sampleRate);
    const d = buf.getChannelData(0);
    for (let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
    const src = a.createBufferSource(); src.buffer = buf;
    const bq = a.createBiquadFilter(); bq.type="bandpass"; bq.frequency.value=filter; bq.Q.value=0.8;
    const g = a.createGain(); g.gain.value = gain;
    src.connect(bq); bq.connect(g); g.connect(a.destination);
    src.start();
  }

    const st = G.state;

        G.klass = G.klass==="melee" ? "ranger" : "melee"; showTitle();

      if (k==="." ){
        const s=loadSave(); s.ascension=Math.min(6,(s.ascension||0)+1);
        saveSave(s); G.save=s; showTitle();
      }
      if (k==="enter" || k==="r"){ startRun(G.mode||"endless"); ensureAudio(); return; }
      ensureAudio();
      return;
    }

    if (st==="achievements"){
      if (k==="escape" || k==="a"){ G.state="title"; showTitle(); }
      ensureAudio();
      return;
    }

    if (st==="modeSelect" || st==="challengeSelect" || st==="customSelect" || st==="dailySelect"){
      if (k==="escape"){
        if (st==="customSelect" || st==="challengeSelect" || st==="dailySelect") showModeSelect();
        else { G.state="title"; showTitle(); }
      }
      ensureAudio();
      return;
    }

    if (st==="hexPick"){
      if (!G.hexOffer.length){ ensureAudio(); return; }
      if (k==="arrowleft" || k==="a"){ G.hexPickIndex=(G.hexPickIndex+G.hexOffer.length-1)%G.hexOffer.length; renderHexPick(); }
      if (k==="arrowright" || k==="d"){ G.hexPickIndex=(G.hexPickIndex+1)%G.hexOffer.length; renderHexPick(); }
      if (k==="enter" || k==="j"){ applyHexPick(); }
      if (k==="escape" || k==="e"){ skipHexPick(); }
      ensureAudio();
      return;
    }

    if (st==="exit"){
      if (k==="arrowleft" || k==="a"){ G.exitIndex=0; renderExit(); }
      if (k==="arrowright" || k==="d"){ G.exitIndex=1; renderExit(); }
      if (k==="enter"){ confirmExit(); }
      ensureAudio();
      return;
    }

    if (st==="pause"){
      if (k==="escape"){ closePause(); ensureAudio(); return; }
      if (k==="arrowup" || k==="w"){ G.pauseIndex=(G.pauseIndex+2)%3; renderPause(); }
      if (k==="arrowdown" || k==="s"){ G.pauseIndex=(G.pauseIndex+1)%3; renderPause(); }
      if (k==="enter"){ confirmPause(); }
      ensureAudio();
      return;
    }

    if (st==="pauseConfirm"){
      if (k==="escape"){ G.state="pause"; renderPause(); ensureAudio(); return; }
      if (k==="arrowleft" || k==="a" || k==="arrowright" || k==="d"){
        G.pauseIndex = G.pauseIndex===0?1:0; renderPause();
      }
      if (k==="enter"){ doAbandonConfirm(); }
      ensureAudio();
      return;
    }

    if (st==="dead" || st==="win" || st==="dying"){
      if (k==="r"){ restartFromAnywhere(); }
      if (k==="escape"){ showTitle(); }
      ensureAudio();
      return;
    }

    if (st==="playing"){

  // [P0] 闪避成功反馈：泛用户学会闪避的唯一通道，禁止静默
  function applyLifesteal(dmg){
    const C = G.C || CFG;
    if (!C.lifesteal || !player.alive || dmg <= 0) return;
    if (player.hp >= player.maxHp) return;
    let mul = C.lifesteal;
    if (C.lifestealOnBreakMul > 1 && player.lifestealBreakTimer > 0) mul *= C.lifestealOnBreakMul;
    const cap = C.lifestealCap || 2;
    const heal = Math.min(cap, Math.max(0, Math.floor(dmg * mul)));
    if (heal <= 0) return;
    player.hp = Math.min(player.maxHp, player.hp + heal);
    floatText(player.x, player.y - 34, "+" + heal, "#7dffc2", 11);
  }

  function applyKillHeal(){
    const C = G.C || CFG;
    if (!C.healOnKill || !player.alive) return;
    const heal = C.healOnKill;
    player.hp = Math.min(player.maxHp, player.hp + heal);
    floatText(player.x, player.y - 36, "+" + heal, "#7dffc2", 12);
    burst(player.x, player.y, "#7dffc2", 6, 80, 0.22);
  }

  // ========== 存档（M-14/15）==========
  const SAVE_KEY = "breakgulf.save";

  const META_SHOP = [
    { id: "hex_pick4", name: "拓宽抉择", cost: 120, desc: "海克斯三选一 → 四选一" },
    { id: "heal_budget", name: "行囊扩容", cost: 90, desc: "每层治疗球预算 +1" },

  function hasMeta(id){
    const s = G.save || loadSave();
    return !!(s.unlocked && s.unlocked.includes(id));
  }
  function loadSave(){
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return { currency:0, codex:{}, best:{depth:0,level:0}, ascension:0, runs:0, unlocked:[], daily:[], ach:{}, stats:{kills:0,breaks:0,noHitRooms:0} };
      const s = JSON.parse(raw);
      return {
        currency: s.currency||0,
        codex: s.codex||{},
        best: s.best||{depth:0,level:0},
        ascension: s.ascension||0,
        runs: s.runs||0,
        unlocked: s.unlocked||[],
        daily: s.daily||[],
        ach: s.ach||{},
        stats: s.stats||{kills:0,breaks:0,noHitRooms:0},
      };
    } catch(e){
      return { currency:0, codex:{}, best:{depth:0,level:0}, ascension:0, runs:0, unlocked:[], daily:[], ach:{}, stats:{kills:0,breaks:0,noHitRooms:0} };
    }
  }
  function saveSave(s){
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(s)); } catch(e){}

  function addCurrency(n){
    const s = loadSave();
    s.currency = (s.currency||0) + n;
    saveSave(s);
    G.save = s;
    updateCurrencyHud();

  function updateCurrencyHud(){
    const s = G.save || loadSave();

  function payout(depth, reason){
    const k = Math.floor(depth / CFG.exitEvery);
    const base = k > 0
      ? Math.round(CFG.exitPayoutBase * Math.pow(k, CFG.exitPayoutPow))
      : Math.round(depth * 3);
    const mul = reason === "exit" ? 1.0 : CFG.deathPayoutMul;
    return Math.max(0, Math.round(base * mul));
  }
  function settle(reason){
    const gain = payout(G.room, reason);
    addCurrency(gain);
    const s = loadSave();
    s.runs = (s.runs||0) + 1;
    if (G.room > (s.best.depth||0)) s.best.depth = G.room;
    if (G.level > (s.best.level||0)) s.best.level = G.level;
    // 图鉴：主动出口结算才 mastered
    if (reason === "exit"){
      for (const id of G.hexes){
        s.codex[id] = "mastered";
      }
    } else {
      for (const id of G.hexes){
        if (s.codex[id] !== "mastered") s.codex[id] = "seen";
      }
    }
    saveSave(s);
    G.save = s;
    return gain;
  }

  // ========== Enemies ==========
  function makeGrunt(x,y){

  function spawnEnemy(type,x,y,mul){
    mul = mul || G.waveMul || 1;
    x=clamp(x,CFG.pad+40,CFG.roomW-CFG.pad-40);
    y=clamp(y,CFG.pad+40,CFG.roomH-CFG.pad-40);
    if (dist(x,y,player.x,player.y)<120){
      const a=angleTo(player.x,player.y,x,y);
      x=clamp(player.x+Math.cos(a)*160,CFG.pad+40,CFG.roomW-CFG.pad-40);
      y=clamp(player.y+Math.sin(a)*160,CFG.pad+40,CFG.roomH-CFG.pad-40);
    }
    let e;
    if (type==="grunt") e=makeGrunt(x,y);
    else if (type==="caster") e=makeCaster(x,y);
    else if (type==="dasher") e=makeDasher(x,y);
    else e=makeElite(x,y);
    // 三速：生命全速、韧性 ^0.55、伤害 ^0.40
    e.maxHp = Math.max(1, Math.round(e.maxHp * mul));
    e.hp = e.maxHp;
    e.maxPoise = Math.max(1, Math.round(e.maxPoise * Math.pow(mul, 0.55) * ((G.C||CFG).enemyPoiseMul||1)));
    e.poise = e.maxPoise;
    const baseDmgMap = { grunt:CFG.gruntDmg, caster:CFG.casterDmg, dasher:CFG.dasherDmg, elite:CFG.eliteDmg };
    e.baseDmg = baseDmgMap[e.type] || 12;
    e.dmg = Math.max(1, Math.round(e.baseDmg * Math.pow(mul, 0.40)));
    e.mul = mul;
    // 爬升 4：词条（前摇更短）
    if ((G.C||CFG).affixChance && Math.random() < (G.C||CFG).affixChance){
      e.affix = "quick";
      e.windup *= 0.7;
    }
    enemies.push(e);
    const col = e.type==="grunt"?"#ff8a5c":e.type==="caster"?"#b07dff":e.type==="dasher"?"#5ecbff":"#ffd27a";
    ring(x,y, e.type==="elite"?40:28, col, 0.28, 2);
    burst(x,y,col, e.type==="elite"?16:8, 90, 0.28);
    return e;
  }
  function randomSpawnPos(){
    const side = Math.floor(gameRandom()*4);
    const W=CFG.roomW,H=CFG.roomH,P=CFG.pad;
    if(side===0) return {x:P+50+gameRandom()*(W-P*2-100), y:P+48};
    if(side===1) return {x:P+50+gameRandom()*(W-P*2-100), y:H-P-48};
    if(side===2) return {x:P+48, y:P+50+gameRandom()*(H-P*2-100)};
    return {x:W-P-48, y:P+50+gameRandom()*(H-P*2-100)};
  }

  // ========== Combat ==========
  function fireRangerShot(type){
    const C = G.C || CFG;
    const heavy = type === "heavy";
    let dmg = heavy ? C.heavyDmg : C.lightDmg;
    let poise = heavy ? C.heavyPoise : C.lightPoise;
    let speed = (heavy ? CFG.rangerHeavyProjSpeed : CFG.rangerLightProjSpeed) * (C.projSpeedMul||1);
    let r = (heavy ? 9 : 6) * (C.projSizeMul||1);
    const col = heavy ? "#ffd27a" : "#7dffc2";
    const base = player.facing;
    dmg *= (C.projDmgMul||1);
    if (C.dmgMulLevel) dmg *= 1 + C.dmgMulLevel;
    if (C.dmgMulGlobal) dmg *= C.dmgMulGlobal;
    poise *= (C.projPoiseMul||1);

    // 反击刻度：闪避后首次攻击
    if (C.counterDmgMul > 1 && player.counterWindow > 0 && !player.counterUsed){
      dmg *= C.counterDmgMul;
      player.counterUsed = true;
      floatText(player.x, player.y-28, "反击！", "#ffd27a", 13);
    }

    const add = C.projCountAdd || 0;
    const n = 1 + add;
    const spread = n <= 1 ? 0 : (C.projOrbit ? 0.9 : 0.28);
    for (let i = 0; i < n; i++){
      const t = n === 1 ? 0 : (i - (n-1)/2) * spread;
      const a = base + t;
      G.projectiles.push({
        x: player.x + Math.cos(a) * 18,
        y: player.y + Math.sin(a) * 18,
        vx: Math.cos(a) * speed,
        vy: Math.sin(a) * speed,
        r, life: 1.8,
        friendly: true,
        dmg: Math.round(dmg * (n > 1 ? 0.92 : 1)),
        poise: Math.round(poise),
        col, heavy,
        pierce: C.projPierce || 0,
        homing: C.projHoming || 0,
        hitIds: new Set(),
      });
    }
    burst(player.x + Math.cos(base)*14, player.y + Math.sin(base)*14, col, 6, 90, 0.2);
    if (heavy) SFX.heavy(); else SFX.light();
    hitstop(heavy ? 35 : 18);
  }

  function startAttack(type){
    if (!player.alive) return;
    if (player.atk) return;
    if (player.dodgeTimer>0) return;
    if (type==="light" && (G.C||CFG).noLight) return;
    if (type==="light"){
      player.atk = {type, t:0, phase:"windup", hit:new Set()};
    } else {
      player.atk = {type, t:0, phase:"windup", hit:new Set()};
    }
  }

  function activeWindow(atk){
    const C = G.C || CFG;
    if (atk.type==="light") return {start:C.lightWindup, end:C.lightWindup+C.lightActive, range:C.lightRange, arc:C.lightArc};
    return {start:C.heavyWindup, end:C.heavyWindup+C.heavyActive, range:C.heavyRange, arc:C.heavyArc};
  }

  function resolveAttackHits(){
    const C = G.C || CFG;
    const atk = player.atk;
    if (!atk || atk.phase!=="active") return;

    // 远程：进入 active 时发射弹道（hit Set 保证只发一次）
    if (C.attackStyle === "ranged" && !atk.fired) {
      atk.fired = true;
      fireRangerShot(atk.type);
      return;
    }

    const win = activeWindow(atk);
    const baseDmg = atk.type==="light"?C.lightDmg:C.heavyDmg;
    const basePoise = atk.type==="light"?C.lightPoise:C.heavyPoise;
    let any=false;

    for (const e of enemies){
      if (e.hp<=0 || atk.hit.has(e.id)) continue;
      const d = dist(player.x,player.y,e.x,e.y);
      if (d > win.range + e.r) continue;
      const ang = angleTo(player.x,player.y,e.x,e.y);
      if (Math.abs(angDiff(ang, player.facing)) > win.arc/2) continue;

      atk.hit.add(e.id);
      any = true;
      G.tel.closeHits += d<=C.closeRange ? 1 : 0;

      const close = d <= C.closeRange;
      // [P0] 贴脸加成只作用于轻击；重击保持 18，避免贴脸重击一击破防成为严格占优
      const closeMul = close
        ? (atk.type==="light" ? C.closePoiseMul : C.closePoiseHeavyMul)
        : 1;
      let poiseDmg = basePoise * closeMul;
      let dmg = baseDmg;
      let brokeNow = false;

      // 追击本能：对前摇中的敌人增伤
      if (C.dmgMulWindup && e.state === "windup") {
        dmg *= 1 + C.dmgMulWindup;
      }
      // 等级成长
      if (C.dmgMulLevel) dmg *= 1 + C.dmgMulLevel;
      if (C.dmgMulGlobal) dmg *= C.dmgMulGlobal;
      // 反击刻度
      if (C.counterDmgMul > 1 && player.counterWindow > 0 && !player.counterUsed){
        dmg *= C.counterDmgMul;
        player.counterUsed = true;
        floatText(e.x, e.y-e.r-22, "反击！", "#ffd27a", 13);
      }
      // 三段之势：轻击第 3 段
      if (atk.type === "light" && C.thirdLightPoise > 1){
        player.lightCombo = (player.lightCombo || 0) + 1;
        if (player.lightCombo % 3 === 0){
          poiseDmg *= C.thirdLightPoise;
          floatText(e.x, e.y-e.r-22, "三段", "#7dffc2", 12);
        }
      } else if (atk.type === "heavy"){
        player.lightCombo = 0;
      }
      // 孤勇：单体削韧
      const aliveCount = enemies.filter(x=>x.hp>0).length;
      if (C.soloPoiseMul > 1 && aliveCount <= 1) poiseDmg *= C.soloPoiseMul;

      if (e.broken>0 || e.permanentBreak) {
        dmg *= C.breakDmgMul;
        if (e.broken>0) G.tel.breaksUsed += 1;
      }

      e.hp -= dmg;
      applyLifesteal(dmg);
      e.hitFlash = 0.12;
      e.stun = Math.max(e.stun, atk.type==="heavy"?0.22:0.12);
      // 击退
      const push = norm(e.x-player.x, e.y-player.y);
      e.x += push.x * (atk.type==="heavy"?14:8);
      e.y += push.y * (atk.type==="heavy"?14:8);

      // 削韧
      if (e.broken<=0 && !e.permanentBreak){
        e.poise -= poiseDmg;
        if (e.poise<=0){
          e.poise=0;
          brokeNow=true;
          onBreak(e);
        }
      }

      const windupHit = e.state === "windup";
      if (windupHit) bumpHexCounter("windupHits", 1);

      // 轻击命中计数（三段之势）
      if (atk.type==="light") bumpHexCounter("lightHits", 1);
      if (brokeNow && d <= C.closeRange) bumpHexCounter("closeBreaks", 1);

      const color = e.broken>0 || brokeNow || e.permanentBreak ? "#ffd36a" : "#fff";
      const size = e.broken>0 || brokeNow || e.permanentBreak ? 18 : (atk.type==="heavy"?15:13);
      floatText(e.x, e.y-e.r-10, String(Math.round(dmg)), color, size);
      if (windupHit && C.dmgMulWindup) floatText(e.x - 20, e.y-e.r-4, "追击", "#9dffc8", 11);
      if (close) floatText(e.x+18, e.y-e.r-4, "贴脸", "#5dffb0", 11);
      burst(e.x,e.y, brokeNow?"#ffd36a":"#ffe2b0", brokeNow?16:7, brokeNow?200:130, brokeNow?0.4:0.25);
      shake(atk.type==="heavy"?7:4);
      if (brokeNow) hitstop(C.hitstopBreakMs);
      else hitstop(atk.type==="heavy"?C.hitstopHeavyMs:C.hitstopLightMs);
      SFX.hit();
      if (brokeNow) SFX.breakSfx();
    }

    if (any){
      if (atk.type==="light") SFX.light(); else SFX.heavy();
    }
  }

  function onBreak(e){
    const C = G.C || CFG;
    G.breaks += 1;
    bumpHexCounter("breaks", 1);
    applyBreakHeal(e);
    checkAchievements();
    e.broken = e.type==="grunt" ? C.gruntBreakTime : C.casterBreakTime;
    e.state = "broken";
    e.timer = 0;
    // 崩解：每次破防削该敌韧性上限
    if (C.breakPoiseStack) {
      e.maxPoise = Math.max(4, e.maxPoise * (1 + C.breakPoiseStack));
    }
    const hexCol = G.hexes.includes("hex_frag") ? TIER_COLOR.prism
      : G.hexes.includes("hex_collapse") ? TIER_COLOR.gold
      : "#ffd36a";
    ring(e.x,e.y, e.r+34, hexCol, 0.4, 4);
    ring(e.x,e.y, e.r+18, "#fff3c4", 0.28, 2);
    burst(e.x,e.y,hexCol,22,220,0.5);
    floatText(e.x,e.y-e.r-22,"破防",hexCol,16);
    flashScreen(0.12,[255,211,106]);
    shake(10);
    poiseHint.classList.add("show");
    setTimeout(()=>poiseHint.classList.remove("show"), 1200);
    if (!G.slowmoUsed){
      G.slowmoUsed = true;
      G.slowmo = CFG.firstBreakSlowmo;
    }
  }

  function damagePlayer(amount, source, tip){
    if (!player.alive || player.invuln>0) return;
    const C = G.C || CFG;
    // 坦克格挡：闪避后短窗减伤
    if (C.blockWindow > 0 && player.blockTimer > 0 && C.blockMul < 1){
      amount = Math.max(1, Math.round(amount * C.blockMul));
      floatText(player.x, player.y-28, "格挡", "#5ecbff", 12);
      ring(player.x, player.y, player.r+14, "#5ecbff", 0.22, 2);
    }
    player.hp -= amount;
    player.hitFlash = 0.18;
    player.invuln = Math.max(player.invuln, 0.4);
    G.tel.hitsTaken += 1;
    shake(11);
    burst(player.x,player.y,"#ff5d6c",16,180,0.4);
    floatText(player.x,player.y-26,"-"+amount,"#ff8a96",15);
    SFX.hurt();
    G.killer = {name:source.name, action:source.action, tip};
    if (player.hp<=0){
      player.hp=0; player.alive=false;
      // [P0] 立即结束采样窗口，禁止 death anim 期间继续拉低接近比
      G.state="dying";
      G.deathFlash=0.5;
      SFX.die();
      setTimeout(showDeath, 430);
    }
  }

  function updatePlayer(dt){
    if (!player.alive) return;
    player.dodgeCd = Math.max(0, player.dodgeCd-dt);
    player.invuln = Math.max(0, player.invuln-dt);
    player.hitFlash = Math.max(0, player.hitFlash-dt);
    player.dodgeTimer = Math.max(0, player.dodgeTimer-dt);
    if (player.counterWindow > 0) player.counterWindow = Math.max(0, player.counterWindow - dt);
    if (player.blockTimer > 0) player.blockTimer = Math.max(0, player.blockTimer - dt);
    if (player.lifestealBreakTimer > 0) player.lifestealBreakTimer = Math.max(0, player.lifestealBreakTimer - dt);

    // 攻击状态机 —— active 窗口内每帧 resolve，hit Set 防重复
    if (player.atk){
      const atk = player.atk;
      atk.t += dt;
      const isLight = atk.type==="light";
      const C = G.C || CFG;
      const wu = isLight?C.lightWindup:C.heavyWindup;
      const ac = isLight?C.lightActive:C.heavyActive;
      const rc = isLight?C.lightRecover:C.heavyRecover;
      if (atk.phase==="windup" && atk.t>=wu){
        atk.phase="active";
        resolveAttackHits();
      } else if (atk.phase==="active"){
        // [P0] 判定窗口必须整段有效，不能只在切换帧 resolve 一次
        if (atk.t >= wu+ac) atk.phase="recover";
        else resolveAttackHits();
      } else if (atk.phase==="recover" && atk.t>=wu+ac+rc){
        player.atk=null;
      }
    }

    // 闪避起手：0.04s 后才进入无敌帧（GDD §4.2）
    if (player.dodgeTimer > 0){
      const elapsed = (G.C||CFG).dodgeTotal - player.dodgeTimer;
      if (elapsed >= (G.C||CFG).dodgeStartup){
        player.invuln = Math.max(player.invuln, (G.C||CFG).dodgeIFrame);
      }
    }

    // 朝向
    if (player.dodgeTimer<=0){
      const mdx=mouseX-player.x, mdy=mouseY-player.y;
      if (Math.hypot(mdx,mdy)>8) player.facing = Math.atan2(mdy,mdx);
    }

    // 输入：闪避优先于攻击，同帧取消攻击僵直
    if (keys[" "]) { tryDodge(); keys[" "]=false; }
    // 左键 = 轻击(J)，右键 = 重击(K)；闪避中不可起手
    if (player.dodgeTimer<=0){
      if (keys["j"] || mouseL) { startAttack("light"); if(keys["j"]) keys["j"]=false; }
      if (keys["k"] || mouseR) { startAttack("heavy"); if(keys["k"]) keys["k"]=false; }
    }

    let vx=0,vy=0;
    const isRanged = (G.C||CFG).attackStyle === "ranged";
    if (player.dodgeTimer>0){
      const distTravel = (G.C||CFG).dodgeDistance / (G.C||CFG).dodgeTotal; // px/s
      vx = player.dodgeDx * distTravel;
      vy = player.dodgeDy * distTravel;
      if (Math.random()<0.75) addGhost();
    } else if (isRanged){
      // 远程：移动射击，攻击全程不降速、不锁步
      let dx=0,dy=0;
      if (keys["w"]||keys["arrowup"]) dy-=1;
      if (keys["s"]||keys["arrowdown"]) dy+=1;
      if (keys["a"]||keys["arrowleft"]) dx-=1;
      if (keys["d"]||keys["arrowright"]) dx+=1;
      const n=norm(dx,dy);
      vx=n.x*(G.C||CFG).playerSpeed;
      vy=n.y*(G.C||CFG).playerSpeed;
    } else {
      // 近战：前摇 40% / 判定 15% / 后摇 55% 可移动
      // 闪避已在 tryDodge 清空 atk，可打断任何攻击僵直
      let dx=0,dy=0;
      if (keys["w"]||keys["arrowup"]) dy-=1;
      if (keys["s"]||keys["arrowdown"]) dy+=1;
      if (keys["a"]||keys["arrowleft"]) dx-=1;
      if (keys["d"]||keys["arrowright"]) dx+=1;
      const n=norm(dx,dy);
      let sp = (G.C||CFG).playerSpeed;
      if (player.atk){
        if (player.atk.phase==="windup") sp *= 0.40;
        else if (player.atk.phase==="active") sp *= 0.15;
        else sp *= 0.55; // recover：贴脸不再完全锁死
      }
      vx=n.x*sp; vy=n.y*sp;
    }

    player.x += vx*dt;
    player.y += vy*dt;
    const P=CFG.pad;
    player.x=clamp(player.x,P+player.r,CFG.roomW-P-player.r);
    player.y=clamp(player.y,P+player.r,CFG.roomH-P-player.r);

    // 拾取
    for (let i=G.drops.length-1;i>=0;i--){
      const d=G.drops[i];
      d.life-=dt; d.pulse+=dt;
      if (d.life<=0){ G.drops.splice(i,1); continue; }
      if (dist(player.x,player.y,d.x,d.y)<player.r+d.r+6){
        const heal=Math.round(10 * Math.pow(G.waveMul||1, 0.40));
        player.hp=Math.min(player.maxHp,player.hp+heal);
        floatText(d.x,d.y-8,"+"+heal,"#5dffb0",13);
        burst(d.x,d.y,"#5dffb0",8,100,0.28);
        SFX.pickup();
        G.heals += 1;
        G.drops.splice(i,1);
      }
    }
  }

  function tryDodge(){
    if (!player.alive || player.dodgeCd>0 || player.dodgeTimer>0) return;
    // 攻击取消：前摇/判定/后摇均可被闪避打断（贴脸不僵死）
    const cancelledAtk = !!player.atk;
    let dx=0,dy=0;
    if (keys["w"]||keys["arrowup"]) dy-=1;
    if (keys["s"]||keys["arrowdown"]) dy+=1;
    if (keys["a"]||keys["arrowleft"]) dx-=1;
    if (keys["d"]||keys["arrowright"]) dx+=1;
    if (dx===0&&dy===0){ dx=Math.cos(player.facing); dy=Math.sin(player.facing); }
    const n=norm(dx,dy);
    player.dodgeDx=n.x; player.dodgeDy=n.y;
    player.dodgeTimer=(G.C||CFG).dodgeTotal;
    player.dodgeCd=(G.C||CFG).dodgeCooldown;
    player.dodgeIFrameArmed = true;
    player.atk=null;
    // 坦克：闪避后开启格挡窗
    if ((G.C||CFG).blockWindow > 0) player.blockTimer = (G.C||CFG).blockWindow;
    bumpHexCounter("dodges", 1);
    if (cancelledAtk) floatText(player.x, player.y-26, "取消", "#9dceff", 11);
    burst(player.x,player.y,"#5dffb0",7,110,0.25);
    SFX.dodge();
  }

  // ========== Enemy AI ==========
  function updateEnemies(dt){
    const playerSpeed = (G.C||CFG).playerSpeed;

    for (const e of enemies){
      if (e.hp<=0) continue;
      e.hitFlash=Math.max(0,e.hitFlash-dt);

      if (e.broken>0){
        e.broken -= dt;
        if (e.broken<=0){
          e.broken=0;
          // [碎构] poiseRegen=0 → 永久破防，不再恢复韧性
          if ((G.C||CFG).poiseRegen === 0){
            e.permanentBreak = true;
            e.poise = 0;
            e.state = e.type==="grunt"?"chase":"reposition";
            e.timer=0;
            ring(e.x,e.y,e.r+16, TIER_COLOR.prism, 0.3, 2);
          } else {
            e.poise=e.maxPoise;
            e.state = e.type==="grunt"?"chase":"reposition";
            e.timer=0;
            ring(e.x,e.y,e.r+16,"#5ecbff",0.25,2);
          }
        }
        continue;
      }

      if (e.stun>0){ e.stun-=dt; continue; }

      const dPlayer=dist(e.x,e.y,player.x,player.y);
      const toPlayer=angleTo(e.x,e.y,player.x,player.y);
      e.facing=toPlayer;

      if (e.type==="grunt") updateGrunt(e,dt,dPlayer,toPlayer,playerSpeed);
      else if (e.type==="dasher") updateDasher(e,dt,dPlayer,toPlayer,playerSpeed);
      else if (e.type==="elite") updateElite(e,dt,dPlayer,toPlayer,playerSpeed);
      else updateCaster(e,dt,dPlayer,toPlayer,playerSpeed);

      const P=CFG.pad;
      e.x=clamp(e.x,P+e.r,CFG.roomW-P-e.r);
      e.y=clamp(e.y,P+e.r,CFG.roomH-P-e.r);
    }

    // projectiles
    for (let i=G.projectiles.length-1;i>=0;i--){
      const p=G.projectiles[i];
      p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt;
      const P=CFG.pad;
      if (p.life<=0||p.x<P||p.x>CFG.roomW-P||p.y<P||p.y>CFG.roomH-P){
        G.projectiles.splice(i,1); continue;
      }

      // 玩家弹道：追踪 + 贯穿
      if (p.friendly){
        if (p.homing){
          let best=null, bd=1e9;
          for (const e of enemies){
            if (e.hp<=0) continue;
            const d=dist(p.x,p.y,e.x,e.y);
            if (d<bd){ bd=d; best=e; }
          }
          if (best && bd < 280){
            const want = angleTo(p.x,p.y,best.x,best.y);
            const cur = Math.atan2(p.vy,p.vx);
            let diff = want - cur;
            while (diff>Math.PI) diff-=TAU;
            while (diff<-Math.PI) diff+=TAU;
            const turn = clamp(diff, -p.homing*0.016, p.homing*0.016);
            const na = cur + turn;
            const sp = Math.hypot(p.vx,p.vy);
            p.vx = Math.cos(na)*sp;
            p.vy = Math.sin(na)*sp;
          }
        }
        let consumed=false;
        for (const e of enemies){
          if (e.hp<=0) continue;
          if (p.hitIds && p.hitIds.has(e.id)) continue;
          if (dist(p.x,p.y,e.x,e.y) < p.r + e.r){
            if (p.hitIds) p.hitIds.add(e.id);
            let dmg = p.dmg;
            let poiseDmg = p.poise;
            const windupHit = e.state==="windup";
            const C = G.C || CFG;
            if (C.dmgMulWindup && windupHit) dmg *= 1 + C.dmgMulWindup;
            if (C.dmgMulLevel) dmg *= 1 + C.dmgMulLevel;
            if (C.dmgMulGlobal) dmg *= C.dmgMulGlobal;
            if (e.broken>0 || e.permanentBreak) dmg *= C.breakDmgMul;
            e.hp -= dmg;
            applyLifesteal(dmg);
            e.hitFlash = 0.12;
            e.stun = Math.max(e.stun, p.heavy?0.18:0.08);
            const push = norm(e.x-player.x, e.y-player.y);
            e.x += push.x * (p.heavy?10:5);
            e.y += push.y * (p.heavy?10:5);
            if (e.broken<=0 && !e.permanentBreak){
              e.poise -= poiseDmg;
              if (e.poise<=0){ e.poise=0; onBreak(e); }
            }
            if (windupHit) bumpHexCounter("windupHits", 1);
            const color = e.broken>0||e.permanentBreak ? "#ffd36a" : p.col;
            floatText(e.x, e.y-e.r-10, String(Math.round(dmg)), color, p.heavy?15:13);
            burst(p.x,p.y,p.col,8,140,0.28);
            shake(p.heavy?5:3);
            hitstop(p.heavy?60:40);
            SFX.hit();
            if (p.pierce > 0){ p.pierce -= 1; }
            else { consumed=true; }
            break;
          }
        }
        if (consumed){ G.projectiles.splice(i,1); }
        continue;
      }

      // 无敌帧擦身反馈 —— 仅真正无敌才算闪避成功
      if (player.alive && dist(p.x,p.y,player.x,player.y) < p.r+player.r+2){
        if (player.invuln>0){
          onDodgeSuccess("弹道擦身");
          G.projectiles.splice(i,1);
          continue;
        }
        damagePlayer(p.dmg || (G.C||CFG).casterDmg,{name:"远程压制者",action:"扇面弹道"},"看青蓝轮廓脉冲后横向走位；扇面中间有可过间隙。");
        G.projectiles.splice(i,1);
      }
    }
  }

  function updateGrunt(e,dt,dPlayer,toPlayer,playerSpeed){
    const speed = playerSpeed * (G.C||CFG).gruntSpeedMul * ((G.C||CFG).enemySpeedMul||1);
    if (e.state==="chase"){
      const n=norm(player.x-e.x,player.y-e.y);
      e.x+=n.x*speed*dt; e.y+=n.y*speed*dt;
      e.timer+=dt;
      if (dPlayer < (G.C||CFG).gruntAttackRange + player.r + 8 && e.timer>0.25){
        e.state="windup"; e.timer=0; e.windup=(G.C||CFG).gruntWindup;
        e.telegraphDone=false;
        SFX.windup();
      }
    } else if (e.state==="windup"){
      e.timer+=dt;
      if (!e.telegraphDone && e.timer>0.05){ e.telegraphDone=true; ring(e.x,e.y,e.r+22,"#ff8a5c",0.55,3); }
      if (e.timer>=e.windup){
        e.state="active"; e.timer=0;
        shake(4);
      }
    } else if (e.state==="active"){
      e.timer+=dt;
      // 判定窗口
if (e.timer>=(G.C||CFG).gruntActive*0.5 && e.timer<=(G.C||CFG).gruntActive){
        if (dPlayer < (G.C||CFG).gruntAttackRange + player.r){
          if (player.invuln>0){
            // [P0] 近战闪避成功必须有正反馈，否则失败信号 A 会假阳性
            if (!e._dodgeMarked){
              e._dodgeMarked = true;
              onDodgeSuccess("横扫落空");
            }
          } else {
            damagePlayer(e.dmg || ((G.C||CFG).gruntDmg),{name:"近战推进者",action:"横扫"},"看到橙红填充+粗轮廓时侧向闪避，别后退对冲。");
          }
        }
      }
if (e.timer>=(G.C||CFG).gruntActive){
        e.state="recover"; e.timer=0;
        e._dodgeMarked=false;
      }
    } else if (e.state==="recover"){
      e.timer+=dt;
      if (e.timer>=(G.C||CFG).gruntRecover){
        e.state="chase"; e.timer=0;
      }
    }
  }

  function updateCaster(e,dt,dPlayer,toPlayer,playerSpeed){
    const speed=playerSpeed*(G.C||CFG).casterSpeedMul*((G.C||CFG).enemySpeedMul||1);
    if (e.state==="reposition"){
      const n=norm(e.x-player.x,e.y-player.y);
      let mx=0,my=0;
      if (dPlayer < (G.C||CFG).casterKeep - BODY*0.8){ mx=n.x; my=n.y; }
      else if (dPlayer > (G.C||CFG).casterKeep + BODY){ mx=-n.x; my=-n.y; }
      else { mx=-n.y*0.7; my=n.x*0.7; }
      e.x+=mx*speed*dt; e.y+=my*speed*dt;
      e.timer+=dt;
      if (e.timer>=(G.C||CFG).casterCooldown){
        e.state="windup"; e.timer=0; e.windup=(G.C||CFG).casterWindup; e.telegraphDone=false;
        SFX.windup();
      }
    } else if (e.state==="windup"){
      e.timer+=dt;
      if (!e.telegraphDone && e.timer>0.05){ e.telegraphDone=true; ring(e.x,e.y,e.r+20,"#b07dff",0.7,3); }
      if (e.timer>=e.windup){
        // 三发扇面
        const base=angleTo(e.x,e.y,player.x,player.y);
        const ps = playerSpeed * (G.C||CFG).casterProjSpeedMul;
        const n=(G.C||CFG).fanCount;
        for (let i=0;i<n;i++){
          const t = n===1?0:(i-(n-1)/2)*(G.C||CFG).fanSpread;
          const a=base+t;
          G.projectiles.push({
            x:e.x+Math.cos(a)*18, y:e.y+Math.sin(a)*18,
            vx:Math.cos(a)*ps, vy:Math.sin(a)*ps,
            r:6, life:2.4, friendly:false,
            dmg: e.dmg || C.casterDmg
          });
        }
        burst(e.x,e.y,"#b07dff",8,100,0.25);
        e.state="recover"; e.timer=0;
      }
    } else if (e.state==="recover"){
      e.timer+=dt;
      if (e.timer>=(G.C||CFG).casterRecover){
        e.state="reposition"; e.timer=0;
      }
    }
  }

  function updateDasher(e,dt,dPlayer,toPlayer,playerSpeed){
    const C = G.C || CFG;
    const speed = playerSpeed * C.dasherSpeedMul * (C.enemySpeedMul||1);
    if (e.state==="chase"){
      const n=norm(player.x-e.x,player.y-e.y);
      e.x+=n.x*speed*dt; e.y+=n.y*speed*dt;
      e.timer+=dt;
      if (dPlayer < BODY*6 && e.timer>0.4){
        e.state="windup"; e.timer=0; e.windup=C.dasherWindup; e.telegraphDone=false;
        const a=toPlayer;
        e.chargeDirX=Math.cos(a); e.chargeDirY=Math.sin(a);
        SFX.windup();
      }
    } else if (e.state==="windup"){
      e.timer+=dt;
      if (!e.telegraphDone && e.timer>0.04){
        e.telegraphDone=true;
        ring(e.x,e.y,e.r+20,"#5ecbff",0.4,3);
      }
      // 轻微转向
      e.chargeDirX=lerp(e.chargeDirX, Math.cos(toPlayer), dt*2);
      e.chargeDirY=lerp(e.chargeDirY, Math.sin(toPlayer), dt*2);
      const n=norm(e.chargeDirX,e.chargeDirY); e.chargeDirX=n.x; e.chargeDirY=n.y;
      if (e.timer>=e.windup){ e.state="charge"; e.timer=0; shake(3); }
    } else if (e.state==="charge"){
      e.x += e.chargeDirX * C.dasherChargeSpeed * dt;
      e.y += e.chargeDirY * C.dasherChargeSpeed * dt;
      e.timer+=dt;
      if (player.alive && player.invuln<=0 && dPlayer < e.r+player.r-2){
        damagePlayer(e.dmg||C.dasherDmg,{name:"突进者",action:"冲撞"},"它会突然加速贴脸，短前摇侧闪，别直线后退。");
      }
      if (e.timer>=C.dasherActive){ e.state="recover"; e.timer=0; }
    } else if (e.state==="recover"){
      e.timer+=dt;
      if (e.timer>=C.dasherRecover){ e.state="chase"; e.timer=0; }
    }
  }

  function updateElite(e,dt,dPlayer,toPlayer,playerSpeed){
    const C = G.C || CFG;
    const speed = playerSpeed * C.eliteSpeedMul * (C.enemySpeedMul||1);
    if (e.state==="chase"){
      const n=norm(player.x-e.x,player.y-e.y);
      e.x+=n.x*speed*dt; e.y+=n.y*speed*dt;
      e.timer+=dt;
      if (dPlayer < C.eliteAttackRange + player.r + 10 && e.timer>0.35){
        e.state="windup"; e.timer=0; e.windup=C.eliteWindup; e.telegraphDone=false;
        SFX.windup();
      }
    } else if (e.state==="windup"){
      e.timer+=dt;
      if (!e.telegraphDone && e.timer>0.06){
        e.telegraphDone=true;
        ring(e.x,e.y,e.r+30,"#ffd27a",0.7,4);
      }
      if (e.timer>=e.windup){ e.state="active"; e.timer=0; shake(6); }
    } else if (e.state==="active"){
      e.timer+=dt;
      if (e.timer>=C.eliteActive*0.4 && e.timer<=C.eliteActive){
        if (dPlayer < C.eliteAttackRange + player.r){
          if (player.invuln>0){
            if (!e._dodgeMarked){ e._dodgeMarked=true; onDodgeSuccess("重砸落空"); }
          } else {
            damagePlayer(e.dmg||C.eliteDmg,{name:"精英守卫",action:"重砸"},"大范围砸地，看到金圈立刻滚出圈外。");
          }
        }
      }
      if (e.timer>=C.eliteActive){ e.state="recover"; e.timer=0; e._dodgeMarked=false; }
    } else if (e.state==="recover"){
      e.timer+=dt;
      if (e.timer>=C.eliteRecover){ e.state="chase"; e.timer=0; }
    }
  }

  // Track break utilization: if player attacks while enemy broken
  // handled in resolveAttackHits via e.broken>0

  // ========== Telemetry (主动接近比) ==========
  let debugNearestDist = 0;
  let debugNearestWindup = false;

  function recordTelemetry(dt){
    // [P0] dying/death 期间禁止采样；hitstop dt=0 也不计帧
    if (G.state!=="playing" || dt<=0) return;
    G.tel.frames += 1;
    let nearest=null, nd=1e9;
    for (const e of enemies){
      if (e.hp<=0) continue;
      const d=dist(player.x,player.y,e.x,e.y);
      if (d<nd){ nd=d; nearest=e; }
    }
    debugNearestDist = nearest?nd:0;
    debugNearestWindup = !!(nearest && (nearest.state==="windup"||nearest.state==="active"));
    if (!nearest) return;

    const notTelegraph = !(nearest.state==="windup"||nearest.state==="active");
    // [P0] 单一定义 + dt 归一化：沿敌→玩家方向的接近速度（px/s）
    // 阈值 30px/s 与刷新率无关（60Hz 每帧 0.5px，144Hz 每帧 ~0.21px）
    let approaching=false;
    if (nearest._lx!=null && dt>0){
      const pdx=player.x-nearest._lx, pdy=player.y-nearest._ly;
      const ed=norm(nearest.x-player.x, nearest.y-player.y);
      const alongSpeed = (pdx*ed.x + pdy*ed.y) / dt;
      approaching = alongSpeed > 30;
    }
    nearest._lx=player.x; nearest._ly=player.y;

    if (approaching && notTelegraph){
      G.tel.approachFrames += 1;
    }
    G.tel.ratio = G.tel.frames? G.tel.approachFrames/G.tel.frames : 0;
  }

  // ========== Render ==========
  function drawBg(){
    // vignette base
    const g=ctx.createRadialGradient(CFG.roomW/2,CFG.roomH/2,80, CFG.roomW/2,CFG.roomH/2,CFG.roomW*0.72);
    g.addColorStop(0,"#121a2b");
    g.addColorStop(0.55,"#0b101a");
    g.addColorStop(1,"#06080e");
    ctx.fillStyle=g;
    ctx.fillRect(0,0,CFG.roomW,CFG.roomH);

    const P=CFG.pad, W=CFG.roomW, H=CFG.roomH;
    // floor
    ctx.fillStyle="#0d1320";
    ctx.fillRect(P,P,W-P*2,H-P*2);

    // glow grid
    const grid=48;
    ctx.lineWidth=1;
    for (let x=P;x<=W-P;x+=grid){
      const t=Math.abs(x-P)/((W-P*2)||1);
      ctx.strokeStyle=`rgba(80,130,220,${0.05+0.05*Math.sin(t*3)})`;
      ctx.beginPath(); ctx.moveTo(x+.5,P); ctx.lineTo(x+.5,H-P); ctx.stroke();
    }
    for (let y=P;y<=H-P;y+=grid){
      ctx.strokeStyle="rgba(80,130,220,0.05)";
      ctx.beginPath(); ctx.moveTo(P,y+.5); ctx.lineTo(W-P,y+.5); ctx.stroke();
    }

    // center sigil
    ctx.save();
    ctx.translate(W/2,H/2);
    ctx.strokeStyle="rgba(93,255,176,0.08)";
    ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(0,0,90,0,TAU); ctx.stroke();
    ctx.beginPath(); ctx.arc(0,0,140,0,TAU); ctx.stroke();
    ctx.rotate(Math.PI/4);
    ctx.strokeRect(-70,-70,140,140);
    ctx.restore();

    // border
    ctx.strokeStyle="#2a3d60";
    ctx.lineWidth=2;
    ctx.strokeRect(P,P,W-P*2,H-P*2);
    // corner accents
    const c=22;
    ctx.strokeStyle="#5dffb0";
    ctx.lineWidth=2;
    ctx.globalAlpha=0.55;
    // TL
    ctx.beginPath(); ctx.moveTo(P,P+c); ctx.lineTo(P,P); ctx.lineTo(P+c,P); ctx.stroke();
    // TR
    ctx.beginPath(); ctx.moveTo(W-P-c,P); ctx.lineTo(W-P,P); ctx.lineTo(W-P,P+c); ctx.stroke();
    // BL
    ctx.beginPath(); ctx.moveTo(P,H-P-c); ctx.lineTo(P,H-P); ctx.lineTo(P+c,H-P); ctx.stroke();
    // BR
    ctx.beginPath(); ctx.moveTo(W-P-c,H-P); ctx.lineTo(W-P,H-P); ctx.lineTo(W-P,H-P-c); ctx.stroke();
    ctx.globalAlpha=1;
  }

  function drawTelegraph(e){
    if (e.broken>0) return;
    if (e.type==="grunt" && e.state==="windup"){
      const t=clamp(e.timer/e.windup,0,1);
      const pulse=0.5+0.5*Math.sin(t*Math.PI*7);
      ctx.save();
      ctx.globalAlpha=0.22+t*0.38;
      ctx.fillStyle="#ff5a32";
      ctx.beginPath(); ctx.arc(e.x,e.y,e.r+10+pulse*5,0,TAU); ctx.fill();
      ctx.globalAlpha=0.65+pulse*0.35;
      ctx.strokeStyle="#ffb347";
      ctx.lineWidth=3+pulse*2.2;
      ctx.beginPath(); ctx.arc(e.x,e.y,e.r+12,0,TAU); ctx.stroke();
      // 攻击方向扇形预告
      ctx.globalAlpha=0.28+t*0.35;
      ctx.fillStyle="#ff8a5c";
      ctx.beginPath();
      ctx.moveTo(e.x,e.y);
      ctx.arc(e.x,e.y,CFG.gruntAttackRange, e.facing-0.55, e.facing+0.55);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    if (e.type==="caster" && e.state==="windup"){
      const t=clamp(e.timer/e.windup,0,1);
      const pulse=0.5+0.5*Math.sin(t*Math.PI*7);
      ctx.save();
      ctx.globalAlpha=0.2+t*0.35;
      ctx.fillStyle="#7a4dff";
      ctx.beginPath(); ctx.arc(e.x,e.y,e.r+10+pulse*5,0,TAU); ctx.fill();
      ctx.globalAlpha=0.7+pulse*0.3;
      ctx.strokeStyle="#c9a6ff";
      ctx.lineWidth=3+pulse*2;
      ctx.beginPath(); ctx.arc(e.x,e.y,e.r+12,0,TAU); ctx.stroke();
      // 三线
      const base=angleTo(e.x,e.y,player.x,player.y);
      ctx.setLineDash([9,6]);
      ctx.lineWidth=1.5;
      for (let i=0;i<CFG.fanCount;i++){
        const tt=(i-(CFG.fanCount-1)/2)*(G.C||CFG).fanSpread;
        ctx.strokeStyle=`rgba(176,125,255,${0.35+t*0.45})`;
        ctx.beginPath();
        ctx.moveTo(e.x,e.y);
        ctx.lineTo(e.x+Math.cos(base+tt)*300, e.y+Math.sin(base+tt)*300);
        ctx.stroke();
      }
      ctx.setLineDash([]);
      ctx.restore();
    }
    if (e.type==="dasher" && e.state==="windup"){
      const t=clamp(e.timer/e.windup,0,1);
      const pulse=0.5+0.5*Math.sin(t*Math.PI*8);
      ctx.save();
      ctx.globalAlpha=0.25+t*0.4;
      ctx.fillStyle="#3aa0ff";
      ctx.beginPath(); ctx.arc(e.x,e.y,e.r+8+pulse*4,0,TAU); ctx.fill();
      ctx.strokeStyle=`rgba(94,203,255,${0.6+pulse*0.4})`;
      ctx.lineWidth=3+pulse*2;
      ctx.beginPath(); ctx.arc(e.x,e.y,e.r+10,0,TAU); ctx.stroke();
      ctx.strokeStyle="rgba(94,203,255,0.5)";
      ctx.lineWidth=2; ctx.setLineDash([8,5]);
      ctx.beginPath(); ctx.moveTo(e.x,e.y);
      ctx.lineTo(e.x+e.chargeDirX*180, e.y+e.chargeDirY*180);
      ctx.stroke(); ctx.setLineDash([]);
      ctx.restore();
    }
    if (e.type==="elite" && e.state==="windup"){
      const t=clamp(e.timer/e.windup,0,1);
      const pulse=0.5+0.5*Math.sin(t*Math.PI*5);
      ctx.save();
      ctx.globalAlpha=0.18+t*0.32;
      ctx.fillStyle="#ffb347";
      ctx.beginPath(); ctx.arc(e.x,e.y,(G.C||CFG).eliteAttackRange,0,TAU); ctx.fill();
      ctx.globalAlpha=0.7+pulse*0.3;
      ctx.strokeStyle="#ffd27a";
      ctx.lineWidth=3+pulse*2.5;
      ctx.beginPath(); ctx.arc(e.x,e.y,(G.C||CFG).eliteAttackRange,0,TAU); ctx.stroke();
      ctx.restore();
    }
  }

  function drawEnemy(e){
    if (e.hp<=0) return;
    drawTelegraph(e);
    const broken = e.broken>0;
    const windup = e.state==="windup";
    let fill = e.hitFlash>0 ? "#ffffff" :
      broken ? "#8a93a8" :
      e.type==="grunt" ? (windup?"#ff7a4a":"#d4562e") :
      e.type==="dasher" ? (windup?"#5ecbff":"#2a7ab0") :
      e.type==="elite" ? (windup?"#ffd27a":"#c4922e") :
      (windup?"#c9a0ff":"#6b3fd4");

    ctx.save();
    ctx.translate(e.x,e.y);
    // soft glow
    if (windup && !broken){
      ctx.globalAlpha=0.25;
      ctx.fillStyle = e.type==="grunt"?"#ff5a32":"#9b6bff";
      ctx.beginPath(); ctx.arc(0,0,e.r+10,0,TAU); ctx.fill();
      ctx.globalAlpha=1;
    }
    ctx.rotate(e.facing);
    ctx.fillStyle=fill;
    ctx.strokeStyle = broken ? "#ffd36a" : (windup?"#ffd28a":"rgba(255,255,255,0.15)");
    ctx.lineWidth = broken?3.5:(windup?2.5:1.5);
    if (e.type==="grunt"){
      ctx.beginPath();
      ctx.moveTo(e.r,0);
      ctx.lineTo(-e.r*0.85,e.r*0.78);
      ctx.lineTo(-e.r*0.45,0);
      ctx.lineTo(-e.r*0.85,-e.r*0.78);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
    } else if (e.type==="dasher"){
      ctx.beginPath();
      ctx.moveTo(e.r*1.2,0);
      ctx.lineTo(-e.r*0.6,e.r*0.7);
      ctx.lineTo(-e.r*0.3,0);
      ctx.lineTo(-e.r*0.6,-e.r*0.7);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
    } else if (e.type==="elite"){
      ctx.beginPath();
      ctx.moveTo(e.r,0);
      ctx.lineTo(e.r*0.4,e.r*0.85);
      ctx.lineTo(-e.r*0.7,e.r*0.55);
      ctx.lineTo(-e.r*0.7,-e.r*0.55);
      ctx.lineTo(e.r*0.4,-e.r*0.85);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.moveTo(e.r,0); ctx.lineTo(0,e.r); ctx.lineTo(-e.r,0); ctx.lineTo(0,-e.r);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      // core
      ctx.fillStyle=broken?"#ffd36a":"#e8d6ff";
      ctx.beginPath(); ctx.arc(0,0,4,0,TAU); ctx.fill();
    }
    ctx.restore();

    // bars
    const bw=36, bh=4;
    const x=e.x-bw/2, y=e.y-e.r-16;
    ctx.fillStyle="rgba(0,0,0,0.45)";
    ctx.fillRect(x,y,bw,bh);
    ctx.fillStyle=e.type==="grunt"?"#ff8a5c":"#b07dff";
    ctx.fillRect(x,y,bw*(e.hp/e.maxHp),bh);
    // poise
    const py=y+5;
    ctx.fillStyle="rgba(0,0,0,0.4)";
    ctx.fillRect(x,py,bw,2);
    if (!broken){
      ctx.fillStyle="#ffd36a";
      ctx.fillRect(x,py,bw*(e.poise/e.maxPoise),2);
    } else {
      ctx.fillStyle="#5dffb0";
      ctx.fillRect(x,py,bw,2);
    }
  }

  function drawPlayer(){
    if (!player.alive) return;
    const inv = player.invuln>0 || player.dodgeTimer>0;
    const isRanger = (G.C||CFG).attackStyle === "ranged";
    ctx.save();
    ctx.translate(player.x,player.y);
    if (inv) ctx.globalAlpha = 0.55+0.45*Math.sin(G.time*42);

    // body glow
    ctx.globalAlpha *= 0.35;
    ctx.fillStyle = isRanger ? "#7ab8ff" : "#5dffb0";
    ctx.beginPath(); ctx.arc(0,0,player.r+10,0,TAU); ctx.fill();
    ctx.globalAlpha = inv ? (0.55+0.45*Math.sin(G.time*42)) : 1;

    ctx.fillStyle = player.hitFlash>0 ? "#ff9aa4" : "#eef3ff";
    ctx.beginPath(); ctx.arc(0,0,player.r,0,TAU); ctx.fill();
    ctx.strokeStyle = isRanger ? "#7ab8ff" : "#5dffb0";
    ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(0,0,player.r,0,TAU); ctx.stroke();
    // facing blade / bow
    ctx.strokeStyle = isRanger ? "#9dceff" : "#9dffc8";
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(Math.cos(player.facing)*6, Math.sin(player.facing)*6);
    ctx.lineTo(Math.cos(player.facing)*(player.r+10), Math.sin(player.facing)*(player.r+10));
    ctx.stroke();

    // attack arcs (melee only) / charge flash for ranger
    if (player.atk){
      const atk=player.atk;
      const heavy=atk.type==="heavy";
      const C = G.C || CFG;
      if (C.attackStyle !== "ranged"){
        const range = heavy?C.heavyRange:C.lightRange;
        const arc = heavy?C.heavyArc:C.lightArc;
        let alpha=0.15;
        if (atk.phase==="windup") alpha = 0.15 + 0.35*clamp(atk.t/(heavy?C.heavyWindup:C.lightWindup),0,1);
        if (atk.phase==="active") alpha=0.85;
        if (atk.phase==="recover") alpha=0.25;
        ctx.strokeStyle = heavy ? `rgba(255,179,71,${alpha})` : `rgba(93,255,176,${alpha})`;
        ctx.lineWidth = heavy?5:3;
        ctx.beginPath();
        ctx.arc(0,0,range*0.78, player.facing-arc/2, player.facing+arc/2);
        ctx.stroke();
        if (heavy && atk.phase==="windup"){
          ctx.fillStyle=`rgba(255,179,71,${0.08+0.12*clamp(atk.t/C.heavyWindup,0,1)})`;
          ctx.beginPath();
          ctx.moveTo(0,0);
          ctx.arc(0,0,range, player.facing-arc/2, player.facing+arc/2);
          ctx.closePath(); ctx.fill();
        }
      } else {
        // 远程蓄力光点
        if (atk.phase==="windup"){
          const wu = heavy?C.heavyWindup:C.lightWindup;
          const t = clamp(atk.t/wu, 0, 1);
          ctx.fillStyle = heavy ? `rgba(255,210,122,${0.3+t*0.6})` : `rgba(125,255,194,${0.3+t*0.5})`;
          ctx.beginPath();
          ctx.arc(Math.cos(player.facing)*14, Math.sin(player.facing)*14, 4+t*(heavy?8:4), 0, TAU);
          ctx.fill();
        }
      }
    }
    ctx.restore();
  }

  function drawProjectiles(){
    for (const p of G.projectiles){
      ctx.save();
      const col = p.friendly ? (p.col||"#5dffb0") : "#b07dff";
      ctx.shadowColor = col;
      ctx.shadowBlur = 12;
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,TAU); ctx.fill();
      ctx.restore();
      ctx.strokeStyle = p.friendly ? "rgba(93,255,176,0.35)" : "rgba(176,125,255,0.35)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(p.x-p.vx*0.04, p.y-p.vy*0.04);
      ctx.lineTo(p.x,p.y);
      ctx.stroke();
    }
  }

  function drawFx(){
    for (const g of G.ghosts){
      const t=g.life/g.maxLife;
      ctx.globalAlpha=t*0.4;
      ctx.fillStyle="#5dffb0";
      ctx.beginPath(); ctx.arc(g.x,g.y,g.r,0,TAU); ctx.fill();
    }
    ctx.globalAlpha=1;

    for (const d of G.drops){
      const pulse=1+Math.sin(d.pulse*7)*0.18;
      ctx.save();
      ctx.shadowColor="#5dffb0"; ctx.shadowBlur=16;
      ctx.fillStyle="#5dffb0";
      ctx.beginPath(); ctx.arc(d.x,d.y,d.r*pulse,0,TAU); ctx.fill();
      ctx.restore();
    }

    for (const r of G.rings){
      const t=1-r.life/r.maxLife;
      const rr=lerp(r.r,r.maxR,t);
      ctx.globalAlpha=(1-t)*0.9;
      ctx.strokeStyle=r.color;
      ctx.lineWidth=r.width*(1-t*0.5);
      ctx.beginPath(); ctx.arc(r.x,r.y,rr,0,TAU); ctx.stroke();
    }
    ctx.globalAlpha=1;

    for (const p of G.particles){
      const t=p.life/p.maxLife;
      ctx.globalAlpha=t;
      ctx.fillStyle=p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size*t,0,TAU); ctx.fill();
    }
    ctx.globalAlpha=1;

    ctx.textAlign="center";
    for (const f of G.texts){
      const t=f.life/f.maxLife;
      ctx.globalAlpha=t;
      ctx.fillStyle=f.color;
      ctx.font=`700 ${f.size}px Segoe UI, Microsoft YaHei, sans-serif`;
      ctx.fillText(f.text,f.x,f.y);
    }
    ctx.globalAlpha=1;
  }

  function drawDodgePip(){
    if (!player.alive) return;
    const pct=1-clamp(player.dodgeCd/CFG.dodgeCooldown,0,1);
    const x=player.x, y=player.y+player.r+12;
    ctx.fillStyle="rgba(0,0,0,0.4)";
    ctx.beginPath();
    if (ctx.roundRect) { ctx.roundRect(x-16,y,32,4,2); ctx.fill(); }
    else ctx.fillRect(x-16,y,32,4);
    ctx.fillStyle = pct>=1 ? "#5dffb0" : "#4d6a90";
    ctx.fillRect(x-16,y,32*pct,4);
  }

  function render(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.save();
    if (G.shake>0.1){
      ctx.translate(rand(-1,1)*G.shake, rand(-1,1)*G.shake);
    }

    drawBg();
    drawProjectiles();
    for (const e of enemies) drawEnemy(e);
    drawPlayer();
    drawDodgePip();
    drawFx();

    // flash
    if (G.flash>0){
      const c=G.flashColor||[255,255,255];
      ctx.fillStyle=`rgba(${c[0]},${c[1]},${c[2]},${G.flash*0.35})`;
      ctx.fillRect(0,0,CFG.roomW,CFG.roomH);
    }
    if (G.deathFlash>0){
      ctx.fillStyle=`rgba(255,30,50,${G.deathFlash*0.4})`;
      ctx.fillRect(0,0,CFG.roomW,CFG.roomH);
    }
    // vignette
    const vg=ctx.createRadialGradient(CFG.roomW/2,CFG.roomH/2,CFG.roomW*0.35, CFG.roomW/2,CFG.roomH/2,CFG.roomW*0.72);
    vg.addColorStop(0,"rgba(0,0,0,0)");
    vg.addColorStop(1,"rgba(0,0,0,0.45)");
    ctx.fillStyle=vg;
    ctx.fillRect(0,0,CFG.roomW,CFG.roomH);

    // 署名水印（画布层，DOM 被剥仍在）
    if (typeof drawCreditWatermark === "function") drawCreditWatermark();

// tutorial strip —— [P0] PT-1 禁止剧透破防倍率
    if (G.state==="playing" && G.room===1 && G.roomTime<8){
      ctx.fillStyle="rgba(8,12,20,0.72)";
      const tw=520, th=40;
      const tx=CFG.roomW/2-tw/2, ty=CFG.roomH-88;
      ctx.fillRect(tx,ty,tw,th);
      ctx.strokeStyle="#2a3d60";
      ctx.strokeRect(tx,ty,tw,th);
      ctx.fillStyle="#c9d6ee";
      ctx.font="13px Segoe UI, Microsoft YaHei, sans-serif";
      ctx.textAlign="center";
      const tip = PT_MODE
        ? "轻击 J · 重击 K · 闪避 Space"
        : "轻击 J 凑削韧 · 重击 K 一次重创 · 贴脸削韧更高 · 破防后伤害 ×1.5";
      ctx.fillText(tip, CFG.roomW/2, ty+24);
    }

    ctx.restore();
  }

  // ========== Loop ==========
  let last=performance.now();
  function loop(now){
    let dt=Math.min(0.033,(now-last)/1000);
    last=now;
    if (G.hitstop>0){ G.hitstop-=dt; dt=0; }
    if (G.slowmo>0){ G.slowmo-=dt; dt*=0.35; }

    if (toastTimer>0){ toastTimer-=dt; if(toastTimer<=0) toastEl.classList.remove("show"); }

    G.shake=Math.max(0,G.shake-dt*28);
    G.flash=Math.max(0,G.flash-dt*4);
    G.deathFlash=Math.max(0,G.deathFlash-dt);

    if (G.state==="playing"){
      G.time+=dt; G.runTime+=dt; G.roomTime+=dt;
      if (G.timeStopCd>0) G.timeStopCd-=dt;
      let wdt = dt;
      if (G.timeStopTimer>0){
        G.timeStopTimer -= dt;
        wdt = dt * 0.15;
      }
      updatePlayer(wdt);
      updateEnemies(wdt);
      handleDeaths();
      recordTelemetry(dt);

      if (G.spawnQueue.length>0){
        G.spawnTimer-=dt;
        if (G.spawnTimer<=0){
          const spec=G.spawnQueue.shift();
          const pos=randomSpawnPos();
          spawnEnemy(spec,pos.x,pos.y,G.waveMul);
          G.spawnTimer=0.55 + Math.min(0.4, G.room*0.02);
        }
      }
      enemies=enemies.filter(e=>e.hp>0);
      // M-02 清层：仅在 playing 且非海克斯打断时推进
      if (G.state==="playing" && G.spawnQueue.length===0 && enemies.length===0 && !G.roomClearing){
        G.roomClearing = true;
        onRoomClear();
      }
    } else if (G.state==="pause" || G.state==="pauseConfirm" || G.state==="exit"){
      dt = 0;
    }

    // fx always
    const fdt = dt || 0.016;
    for (let i=G.particles.length-1;i>=0;i--){
      const p=G.particles[i];
      p.life-=fdt; p.x+=p.vx*fdt; p.y+=p.vy*fdt; p.vx*=0.96; p.vy*=0.96;
      if (p.life<=0) G.particles.splice(i,1);
    }
    for (let i=G.ghosts.length-1;i>=0;i--){
      G.ghosts[i].life-=fdt; if(G.ghosts[i].life<=0) G.ghosts.splice(i,1);
    }
    for (let i=G.rings.length-1;i>=0;i--){
      G.rings[i].life-=fdt; if(G.rings[i].life<=0) G.rings.splice(i,1);
    }
    for (let i=G.texts.length-1;i>=0;i--){
      const t=G.texts[i]; t.life-=fdt; t.y+=t.vy*fdt; if(t.life<=0) G.texts.splice(i,1);
    }

    render();
    updateHud();
    requestAnimationFrame(loop);
  }

  function isModeUnlocked(id){
    const m = MODE_BY_ID[id];

    if (m.unlock === "endless") return (s.best?.depth||0) >= 5 || (s.runs||0) >= 1;

    return true;
  }
